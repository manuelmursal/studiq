<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#161616;--m:#74746e;--line:#e5e4df;--acc:#f26b1d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1c1c1b;--ink:#f3f2ee;--m:#9b9a93;--line:#2d2d2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--card:#1c1c1b;--ink:#f3f2ee;--m:#9b9a93;--line:#2d2d2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,.logo{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
h1{font-size:28px;margin:12px 0 4px}h2{font-size:20px;margin:28px 0 10px}
.m{color:var(--m)}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px}
.logo{font-size:28px;cursor:pointer}.logo i{color:var(--acc);font-style:normal}
button,input,select,textarea{font:inherit;color:inherit}
.ib{background:none;border:0;cursor:pointer;padding:8px;border-radius:50%;color:var(--m);display:flex;width:max-content}
.ib:hover{color:var(--ink)}header .ib:first-child{justify-self:start}
main{max-width:900px;margin:0 auto;padding:4px 20px 60px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:10px 20px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.o{background:var(--acc);color:#fff}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
main input:not([type=checkbox]),select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;font-size:13px;color:var(--m);margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:30px auto}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;cursor:pointer}
.tile:hover{border-color:var(--acc)}.tile svg{color:var(--acc)}
.tile b{display:block;font-size:17px;margin-top:12px;font-weight:500}.tile span{color:var(--m);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:560px;margin:20px auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}.bar input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px}
.bk{cursor:pointer}.bk b{display:block;font-weight:500;margin-top:10px}.bk small{color:var(--m)}
.cv{aspect-ratio:3/4;border-radius:4px 10px 10px 4px;padding:16px 14px;color:#fff;display:flex;align-items:flex-end;background-size:cover;background-position:center;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.14);font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.35);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.ed{display:grid;grid-template-columns:200px 1fr;gap:32px;margin-top:16px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--bg);box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}.sw i.on{outline:2px solid var(--ink)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:16px;padding:28px;text-align:center;cursor:pointer;color:var(--m);margin:0}
.drop:hover{border-color:var(--acc)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;margin:16px 0}
.tb{position:relative}.tb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.tb button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.stage{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px}
.book{display:flex;justify-content:center;perspective:1400px;flex:1;max-width:820px;touch-action:pan-y}
.pg{flex:1 1 0;max-width:410px;aspect-ratio:3/4;background:#fff;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.pg img{width:100%;height:100%;object-fit:contain;display:block;user-select:none}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none}
.pg.l{border-radius:8px 0 0 8px;transform-origin:right}.pg.l::after{background:linear-gradient(to left,rgba(0,0,0,.2),transparent 14%)}
.pg.r{border-radius:0 8px 8px 0;transform-origin:left}.pg.r::after{background:linear-gradient(to right,rgba(0,0,0,.2),transparent 14%)}
.fl{animation:fl .4s ease}.fl.r{--d:-70deg}.fl.l{--d:70deg}
@keyframes fl{from{transform:rotateY(var(--d));opacity:.4}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.nx svg{transform:scaleX(-1)}.pn{text-align:center;color:var(--m);margin-top:14px}
#ms{height:340px;overflow:auto;margin:16px 0 0;max-width:none;padding:14px}
.msg{background:var(--bg);border-radius:14px;padding:8px 12px;margin:6px 0;width:fit-content;max-width:80%}
.msg.me{background:var(--acc);color:#fff;margin-left:auto}.msg small{display:block;opacity:.7;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0 0;overflow-x:auto;max-width:560px;margin-inline:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--m);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--acc)}
.plan{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:6px;align-items:center;margin-top:18px}
.plan b{text-align:center;font-weight:500;color:var(--m);padding-bottom:4px}.plan b.today{color:var(--acc)}
.plan .hr{color:var(--m);font-size:13px;text-align:center}
main .plan input{padding:12px 4px;text-align:center;font-size:13px;border-radius:10px;min-width:0}
main .plan input.f{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.pop{animation:pop .24s ease forwards}@keyframes pop{0%{transform:scale(1)}45%{transform:scale(.9)}100%{transform:scale(1.06)}}
main{transition:opacity .2s,transform .2s}main.out{opacity:0;transform:translateY(-6px)}
main.in{animation:enter .4s cubic-bezier(.2,.7,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985)}}
.btn,.tile,.bk,.chip{transition:transform .15s,border-color .15s}.btn:active,.tile:active,.bk:active,.chip:active{transform:scale(.95)}
@media(prefers-reduced-motion:reduce){.pop,main.in{animation:none}main{transition:none}}
.bump{animation:bump .45s ease}@keyframes bump{40%{transform:scale(1.1)}}
main .plan input{transition:background .4s,border-color .4s,color .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
main.in .tile,main.in .bk{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
main.in .tile:nth-child(2),main.in .bk:nth-child(2){animation-delay:.06s}main.in .tile:nth-child(3),main.in .bk:nth-child(3){animation-delay:.12s}main.in .tile:nth-child(4),main.in .bk:nth-child(4){animation-delay:.18s}main.in .tile:nth-child(5),main.in .bk:nth-child(5){animation-delay:.24s}main.in .tile:nth-child(6),main.in .bk:nth-child(6){animation-delay:.3s}
.pop{animation:pop .24s ease forwards!important}
.chip,.btn{transition:transform .15s,border-color .15s,background .2s,color .2s}
body,.card{transition:background-color .3s,border-color .3s,color .3s}
@media(hover:hover){.btn:hover,.tile:hover,.bk:hover{transform:translateY(-2px)}}
.btn:active,.tile:active,.bk:active,.chip:active{transform:scale(.95)}
.btn,.tile,.bk,.chip,.ib{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.toast{animation:ti .3s both}@keyframes ti{from{opacity:0;transform:translate(-50%,12px)}}
@media(pointer:coarse){main input:not([type=checkbox]),select,textarea,main .plan input{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,.pop{animation:none!important;transition:none!important}}
.avc{width:52px;height:52px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid var(--line)}.avc.on{border-color:var(--acc)}
img.av{width:96px;height:96px;object-fit:cover;display:block;border:2px solid var(--line)}
.pc{position:relative}.dt{position:absolute;top:5px;right:5px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--m);cursor:pointer}.dt::after{content:"";position:absolute;inset:-9px}
.av{width:72px;height:72px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:500 30px Fraunces,Georgia,serif;margin:0 auto 8px}
@media(max-width:760px){.ed{grid-template-columns:1fr}.ed>div:first-child{max-width:200px}.stage>.ib{display:none}.tiles{gap:10px}}
.ib{position:relative}.bdg{position:absolute;top:0;right:0;background:var(--acc);color:#fff;border-radius:99px;font-size:11px;font-weight:500;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 5px}.bdg:empty{display:none}
.splash{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:20px;animation:enter .3s both}.splash .card{margin:0;max-height:80vh;overflow:auto;width:100%}.splash li{margin:8px 0}
.logo{letter-spacing:.04em}
.fc{min-height:220px;border:1px solid var(--line);background:var(--card);border-radius:24px;display:grid;place-items:center;text-align:center;padding:28px 22px;font:500 26px/1.3 Fraunces,Georgia,serif;overflow-wrap:anywhere;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.fc.bk2{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.fc small{display:block;font:12px Inter,system-ui,sans-serif;color:var(--m);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.stat b{display:block;font:500 26px Fraunces,Georgia,serif}.stat span{color:var(--m);font-size:13px}
.big{font:500 52px/1.1 Fraunces,Georgia,serif;margin:6px 0}
.ed2{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:start;margin:10px 0}
.hbar{display:flex;align-items:center;gap:10px;margin:10px 0}.hbar span{width:110px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .prog{flex:1}.hbar em{font-style:normal;min-width:44px;text-align:right;font-size:14px}
.hist{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}.hist i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0}.hist span,.hist em{font-size:11px;color:var(--m);font-style:normal}.hist em{margin-top:4px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-weight:500;color:var(--m);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--card);flex-wrap:wrap}.seg button{border:0;background:none;padding:7px 16px;border-radius:99px;cursor:pointer}.seg button.on{background:var(--acc);color:#fff}
.gf{display:grid;grid-template-columns:1.2fr 1.2fr .7fr 1fr auto;gap:10px;align-items:end;margin-top:16px}
@media(max-width:700px){.ed2{grid-template-columns:1fr}.gf{grid-template-columns:1fr 1fr}.gf>.btn{grid-column:1/-1}}
.btn svg{width:22px;height:22px;display:block}
.mi{display:block;max-width:100%;max-height:260px;border-radius:10px;margin:4px 0}
.msg a{display:block}
.ttb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.ttc{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:18px;font:500 56px/1 Fraunces,Georgia,serif;cursor:pointer;color:var(--ink);padding:0}
.ttc:disabled{cursor:default;opacity:1;color:var(--ink)}.ttc.x:disabled{color:var(--acc)}
.ttc:not(:disabled):hover{border-color:var(--acc)}
.ttc.w{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.chb{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,520px);aspect-ratio:1;margin:0 auto;border:3px solid var(--acc);border-radius:14px;overflow:hidden;box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 25%,transparent);user-select:none;-webkit-user-select:none}
.chs{position:relative;border:0;margin:0;padding:0;display:grid;place-items:center;cursor:pointer;min-width:0;aspect-ratio:1}
.chs.l{background:#ffeadb}.chs.d{background:#e8803a}
.chs:disabled{cursor:default}.chs:focus-visible{outline-offset:-3px}
.chs.lm{box-shadow:inset 0 0 0 100px rgba(255,214,60,.45)}.chs.sel{box-shadow:inset 0 0 0 100px rgba(255,214,60,.8)}.chs.ck{box-shadow:inset 0 0 0 100px rgba(214,40,40,.6)}
.chs.tg::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(70,30,5,.35);pointer-events:none}
.chs.tc::after{content:"";position:absolute;inset:5%;border-radius:50%;border:4px solid rgba(70,30,5,.4);pointer-events:none}
.chs i{position:absolute;font:600 10px/1 Inter,system-ui,sans-serif;pointer-events:none;opacity:.85}.chs .rk{left:3px;top:3px}.chs .fl{right:3px;bottom:3px}
.chs.l i{color:#c8601b}.chs.d i{color:#ffeadb}
.cp.mv{position:relative;z-index:3;width:100%;height:100%;display:grid;place-items:center;animation:chmv .3s cubic-bezier(.3,.7,.3,1) both}@keyframes chmv{from{transform:translate(var(--dx),var(--dy))}to{transform:none}}
.chfb{display:none}body.chfs{overflow:hidden}body.chfs header,body.chfs .chx,body.chfs .chv>h1{display:none}
body.chfs main{max-width:none;min-height:100vh;box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center}
body.chfs .chb{width:min(96vw,calc(100vh - 130px),900px)}body.chfs .cp{font-size:clamp(24px,calc(min(96vw,100vh - 130px)/8*.72),100px)}
body.chfs .chv [role=status]{margin:0 0 12px!important;font-size:clamp(16px,3.2vw,22px)!important}
body.chfs .chfb{display:block;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:30}
.cp{font-size:clamp(24px,9vw,54px);line-height:1;pointer-events:none}
.cp.pw{color:#fff;text-shadow:0 0 1px #4a2108,0 0 2px #4a2108,0 1px 3px #4a2108}.cp.pb{color:#26140a}
.btn:disabled{opacity:.4;cursor:default}
.bkw{display:inline-grid;place-items:center;width:var(--s,20px);height:var(--s,20px);vertical-align:middle;flex:none}
.bkw img{width:100%;height:100%;object-fit:contain;display:block}
.bkw.fb{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd27a,var(--acc) 70%);color:#fff;font:600 calc(var(--s,20px)*.6)/1 Fraunces,Georgia,serif}
.bkw.fb::after{content:"B"}
.frm{width:max-content;border-radius:50%;display:block}
.frm.f_sun,.frm.f_sky,.frm.f_mint,.frm.f_violet,.frm.f_flame,.frm.f_rainbow,.frm.f_gold{padding:5px}

.frm.f_violet{background:linear-gradient(135deg,#7c3aed,#c084fc)}
.frm.f_flame{background:linear-gradient(135deg,#f26b1d,#ffb300 50%,#e11d48)}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sic{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:space-between}
.sic .frm{margin:4px auto}.sic .btn{width:100%}
.bkp{display:flex;gap:6px;align-items:center;justify-content:center}

 {v:'2026-11-28.6',t:'Casino und Arcade: viel mehr Details',items:['Neue Optik: Lichtkegel und Staub im Licht per Shader, leuchtende Halos, weiche Schatten unter allen Bananen und Möbeln, Holz-, Marmor- und Teppich-Texturen.','Die Hallen sind voller: im Casino Pokertische mit Stühlen, Chips und Karten, Marmor-Medaillon, Samtseil, Vorhänge, Kristall-Kronleuchter und mehr Automaten. In der Arcade Airhockey, Greifautomaten, Snackautomaten, Tokens, Tickets und Becher auf dem Boden, Hocker, Discokugel und Neon-Geister.','Die Automaten haben abgerundete Gehäuse und gewölbte Röhrenbildschirme.','Besseres Laufen: weiches Anfahren und Bremsen, sanftes Rutschen an Hindernissen, Kamera folgt mit leichtem Schwung, beim Rennen wird das Bild weiter.']},
 {v:'2026-11-28.5',t:'Die Arcade ist jetzt eine 3D-Halle',items:['Neuer Retro-Startbildschirm mit blinkendem Arcade-Hall-Logo, danach läufst du als Banane durch eine öffentliche Halle, die für alle offen ist. Du siehst die anderen mit Namen.','Auf jedem Automaten läuft das passende Spiel als Vorschau. Stell dich davor, drück E oder tippe den Knopf, dann zoomt die Kamera in den Bildschirm und du spielst.','Mit Retro-Musik, Münzsound, Emotes und Vollbild, wie im Casino.']},
 {v:'2026-11-28.4',t:'Neu: Arcade-Halle',items:['Unter Spiele gibt es jetzt die Arcade mit vier Klassikern: Pac-Banana, Snake, Ziegel-Ausbruch und Flappy Banane.','Gesteuert wird mit Pfeiltasten oder WASD, am iPad und Handy durch Wischen oder mit den Pfeilen unter dem Spiel. Dein Rekord pro Spiel wird auf dem Gerät gespeichert, außerdem gibt es einen Vollbildmodus.']},
 {v:'2026-11-28.3',t:'Casino auf dem iPad repariert',items:['Auf dem iPad lag die Touch-Steuerung über dem Knopf zum Spielen und über Bruno, deshalb ließen sich Tische nicht öffnen. Der Knopf ist jetzt immer antippbar.']},
 {v:'2026-11-28.2',t:'Schach: Zuganimation und Vollbild',items:['Die Figuren gleiten jetzt auf ihr Zielfeld, auch der Turm beim Rochieren. Beim Computer-Gegner wartet der Zug kurz, bis deine Animation fertig ist.','Neu: Vollbild-Knopf unter dem Brett. Im Vollbild siehst du nur Brett und Status, mit "Vollbild beenden" oben rechts kommst du zurück.']},
 {v:'2026-11-28.1',t:'Hausaufgaben werden zum Kalender',items:['Auf der Startseite heißt es jetzt Kalender. Beim Eintragen wählst du, ob es eine Hausaufgabe (Standard) oder eine Klausur ist.','Neu bei jedem Eintrag: Lehrer, LK oder GK und ein Link.','Bei Klausuren schlägt STUDIQ passenden Stoff vor, den du als wichtig markieren kannst. Er ist dann im Eintrag mit einem Tipp erreichbar. Dafür musst du update21.sql in Supabase ausführen.']},
 {v:'2026-11-25.1',t:'Schulbücher: Status vollständig oder unvollständig',items:['Beim Bearbeiten eines Schulbuchs gibt es jetzt einen Hebel: grün heißt vollständig, orange heißt, es fehlen noch Seiten. In der Bücherbibliothek sieht man den Status auf jedem Buch.']},
 {v:'2026-11-24.1',t:'Neu: Hausaufgaben mit Kalender',items:['Auf der Startseite gibt es jetzt Hausaufgaben. Im Kalender trägst du ein, was ihr auf habt, mit Fach, Buch, Seite, Aufgabe, Beschreibung und Bild.','Beim Buch schlägt STUDIQ passende Online-Bücher vor. Als Abgabe wählst du "Zur nächsten Stunde" (über deinen Stundenplan) oder ein Datum.','Alle mit deiner Stufe, Schule und Klasse sehen den Eintrag. Offene Hausaufgaben sind orange, abgehakte grün. Dazu gibt es Kommentare.']},
 {v:'2026-11-23.11',t:'Casino Round: Blackjack',items:['Im Casino gibt es jetzt einen Blackjack-Tisch mit Croupier. Blackjack zahlt 2,5×, ein Sieg 2×. Du kannst Karte ziehen, Halten und Verdoppeln. Dafür musst du update18.sql in Supabase ausführen.']},
 {v:'2026-11-23.10',t:'Neu: Bananen-Memory',items:['Bananen-Memory ist ein schnelles Memory-Rennen für zwischendurch. Alle spielen dasselbe Brett mit 8 Paaren, wer am schnellsten fertig ist, bekommt die meisten Punkte. Drei Runden dauern etwa drei Minuten, allein oder mit Freunden per Raumcode.','Im Gespräch mit Bruno steht jetzt, ob seine Antworten von einer KI kommen oder aus dem eingebauten Modus.']},
 {v:'2026-11-23.9',t:'Banana Boost stabiler, Casino lebendiger',items:['Banana Boost: Ein einzelner Fehler stoppt das Spiel nicht mehr. Es gibt einen Framelimiter (60 FPS, bei langsamen Geräten automatisch weniger Auflösung und Partikel, zur Not 30 FPS). Alle Effekte werden vor dem Rennen vorbereitet, damit es beim ersten Boost, Stern oder Banane nicht hängt.','Der Framelimiter gilt jetzt auch für Banana Fight und Casino Round.','Casino Round: 21 Pflanzen in Vasen (Palmen, Büsche und Bananenpflanzen) machen die Halle lebendiger.','Du kannst dich an der Bar mit Bruno unterhalten (E). Er putzt dabei Gläser, hört zu und fragt nach der Schule.']},
 {v:'2026-11-23.8',t:'Neu: Casino Round',items:['Casino Round ist ein ruhiges 3D-Casino mit nur einer Lobby für alle. Du läufst als Banane durch die Halle und siehst die anderen mit Namen und Kontostand über dem Kopf.','Es gibt Roulette, Würfeltisch, Münzwurf, Glücksrad und Spielautomaten. Gespielt wird mit deinen Bookies, der Zufall wird auf dem Server gezogen. Dafür musst du update17.sql in Supabase ausführen.','Mit etwas Glück gewinnst du die goldene Banane. Sie glänzt dauerhaft neben deinem Namen.','Im Hintergrund läuft leise Bar-Musik, die du oben rechts ausschalten kannst. Mit Tasten 1 bis 6 machst du Emotes.','Achtung: Im Casino ist dein Kontostand für alle dort sichtbar, auch wenn er sonst privat ist.']},
 {v:'2026-11-23.7',t:'Banana Boost, Banana Fight und Shop: großes Update',items:['Banana Boost startet mit einer gelben Bananen-Garage, deren Tor aufgeht. Danach bist du in der Garage-Lobby: Mit den Pfeilen links und rechts wechselst du das Auto, unten links den Fahrer. Unten rechts drückst du auf Bereit (gelb, danach braun). Dann entscheidest du, ob du allein oder mit Freunden fährst.','Die Autos sind jetzt Bananen: gelbe, grüne und braune Bananen, eine Schalen-Banane und zwei Bananenblätter.','Items gibt es jetzt als Würfel auf der Strecke, jeder einzeln. Du findest Blitz (bremst alle anderen), Rakete (jagt den Fahrer vor dir), Banane (legst du auf die Straße) und Stern (unverwundbar und schneller).','Banana Fight beginnt mit einer Animation und führt dich in die Lobby. Dort lädst du Freunde ein oder spielst allein gegen Bots.','Mit Esc (oder dem Knopf Menü) öffnest du das Pausenmenü: Weiter spielen, zurück in die Lobby oder Spiel verlassen.','Deine Lebensleiste füllt sich langsam wieder, wenn du 5 Sekunden nicht getroffen wurdest.','Neue Emotes: Tanzen, Salto, Verbeugen, Jubeln und Schlafen. Die Waffe bleibt bei Emotes nicht mehr in der Hand, außer beim neu gemachten Zielen. Die Banane hat jetzt ein Gesicht und zwei Arme.','Im Item-Shop gibt es viele neue Rahmen, Schachbretter, Profil-Themes, STUDIQ-Themes und Titel. Dafür musst du update16.sql in Supabase ausführen.']},
 {v:'2026-11-23.6',t:'Banana Fight auf dem iPad',items:['Banana Fight hat jetzt eine Touch-Steuerung: Mit dem Joystick unten links läufst du (weit ziehen = rennen).','Rechts wischst du über den Bildschirm, um dich umzuschauen. Mit den Knöpfen rechts unten schießt du, springst, zielst, lädst nach und wechselst die Waffe.','Tippe auf „Vollbild“, damit du mehr Platz hast.']},
 {v:'2026-11-23.5',t:'Spanisch als Fach',items:['Spanisch gibt es jetzt in der Fächer-Auswahl, zum Beispiel bei Schulbüchern, Lernmaterial, Vokabeln und Noten.']},
 {v:'2026-11-23.4',t:'Banana Fight: Lobby für mehrere Spieler',items:['Online lädst du jetzt mehrere Freunde gleichzeitig ein. Freunde können deiner Lobby auch direkt über die Liste „Lobbys deiner Freunde“ beitreten.','In der Lobby warten alle aufeinander. Mit „Bereit“ meldest du dich an und kannst dich wieder abmelden. Wenn alle bereit sind, geht es los.','Der Lobby-Leiter (👑) hat neben „Bereit“ den Knopf „Bereit, ohne zu warten“ und startet damit sofort.','In der Lobby kannst du Emotes machen, neu auch „Banane essen“. Danach stimmt ihr über die Map ab.','Nach einer Runde geht es zurück in die Lobby.']},
 {v:'2026-11-23.3',t:'Banana Fight: Emotes',items:['Mit B öffnest du das Emote-Rad: Moonwalk mit Drehung, Peace-Zeichen, Winken und „mäßig Pistole zielen“. Mit der Maus wählst du aus und klickst.','Während des Emotes siehst du deine Banane von vorn. Mit B, beim Laufen, Nachladen oder wenn du getroffen wirst, hörst du auf. Andere sehen dein Emote auch.','Auf dem iPad gibt es oben links einen Emote-Knopf zum Antippen.']},
 {v:'2026-11-23.2',t:'Banana Fight: Sniper, Zielrohr und Map-Abstimmung',items:['Neue Waffe: die Sniper (Taste 4). Sie macht viel Schaden, lädt langsam und ist nur mit Zielrohr richtig genau.','Mit gedrückter rechter Maustaste zielst du mit jeder Waffe durch ein Zielrohr. Das zoomt heran und macht dich genauer, aber langsamer.','Vor jeder Runde stimmst du über die Map ab: Wüstenarena, Dschungeltempel oder Eisfestung.','Beim Nachladen isst du jetzt die Banane-Waffe auf. Danach wächst eine neue nach.','Gegen Bots gewinnst am Ende immer du.']},
 {v:'2026-11-23.1',t:'Neues Spiel: Banana Fight',items:['Banana Fight ist ein 3D-Shooter in der Ich-Perspektive: Du bist eine Banane mit Waffen und kämpfst in einer Arena mit Kisten, Fässern, Mauern und einem Turm.','Drei Waffen (Pistole, Maschinenpistole, Schrotflinte), Kopftreffer machen mehr Schaden. Wer zuerst 15 Treffer hat, gewinnt.','Spielbar gegen Bots oder online mit Raumcode und Freunde-Einladung.']},
 {v:'2026-11-22.2',t:'Favoriten und fixiertes Material',items:['Mit dem Stern markierst du Mitschriften, Schulbücher und Stoff als Favorit. Mit dem Filter "Favoriten" siehst du nur deine markierten Einträge. Die Favoriten sind nur für dich sichtbar.','Admins können Material mit der Pinnnadel oben fixieren. Fixierte Einträge stehen ganz oben, bei den Mitschriften in der Gruppe "Angeheftet".']},
 {v:'2026-11-22.1',t:'Banana Boost: Bergpass und Minikarte',items:['Neue Strecke Bergpass: die längste Strecke, mit Felswänden, Tunnel und Pass. Von den Hängen stürzen Felsen auf die Straße. Rote Warnkreise zeigen, wo sie einschlagen.','Die Minikarte war im Vollbild verzerrt und ist jetzt richtig skaliert.']},
 {v:'2026-11-21.3',t:'Banana Boost: Tunnel, Burnout, Titel im Shop',items:['KartFahrt0 heißt jetzt Banana Boost.','Neue Fahrphysik: Das Auto beschleunigt realistischer, mit Traktion beim Start und weniger Schub bei hohem Tempo.','Gas und Bremse zusammen ergeben einen Burnout mit Staubwolke und vibrierendem Auto. Wer beim Countdown Gas hält, bekommt einen Raketenstart.','Karts haben Auspuffrohre. Beim Boost gibt es Flammen, Funken und eine Rauchwolke.','Die Wiesenstrecke hat einen beleuchteten Tunnel.','Im Item-Shop gibt es Titel, die im Profil unter deinem Namen stehen.']},
 {v:'2026-11-21.2',t:'Kart-Rennen: Boosts, Items und neues Cockpit',items:['Neu: Item-Boxen auf der Strecke. Fährst du durch, bekommst du einen Boost (Blitz oder Rakete), der über deinem Auto schwebt. Mit Leertaste, Shift oder dem Blitz-Knopf löst du ihn aus.','Orange Boost-Pfeile auf der Straße geben dir einen kleinen Schub. Beim Boost gibt es Flammen, Funken, Speedlines und einen Zoom.','Neues Cockpit mit Platz, Runde und Zeit, Tacho, Minikarte und Item-Anzeige. Der Countdown erscheint nur noch einmal.','Pylonen am Straßenrand, Zielstreifen auf der Straße und ein flüssigeres Fahrgefühl.']},
 {v:'2026-11-21.1',t:'Mitschriften als Zeitleiste, neuer Kart-Countdown',items:['Mitschriften sind jetzt eine Zeitleiste nach Datum der Stunde, gruppiert nach Woche und Monat. Wer gefehlt hat, wählt oben "Verpasst? Ab" und sieht den ganzen Stoff seit dem Tag.','Beim Hochladen wählst du Art (Arbeitsblatt, Tafelbild, Mitschrift, Hausaufgabe) und Datum der Stunde. Filtern geht nach Fach.','Kart-Rennen: Der Countdown hat jetzt orange Startlichter, eine große animierte Zahl und ein LOS! zum Start.']},
 {v:'2026-11-20.1',t:'Bookies, Item-Shop und Bookie Clicker',items:['Neu: Bookies. In Spielen sammelst du jetzt Punkte, die Bookies heißen. Du bekommst sie für Siege bei Tic Tac Toe und Schach, für Platzierungen im Kart-Rennen und im neuen Bookie Clicker.','Neu: Bookie Clicker. Klicke Bücher, kaufe Helfer und Verbesserungen und lass deine Bibliothek nach und nach von selbst wachsen.','Neu: Item-Shop (Knopf links neben der Glocke). Dort kaufst du Profil-Rahmen und neue Schachbretter, zum Beispiel ein lila oder ein goldenes. Mit dem i-Zeichen siehst du, wie du Bookies verdienst.','Deine Bookies siehst du in deinem Profil. In den Einstellungen unter Privatsphäre legst du fest, ob andere sie sehen. Standard ist privat.']},
 {v:'2026-11-19.9',t:'Neu: Schach',items:['Bei Spiele gibt es jetzt Schach im orangen STUDIQ-Look. Du spielst gegen den Computer (Leicht, Mittel, Schwer), zu zweit an einem Gerät oder online mit Freunden.','Online hat jeder sein eigenes Gerät. Du siehst, wann du dran bist, und kannst Remis anbieten oder aufgeben.','Alle Regeln sind dabei: Rochade, en passant, Umwandlung, Patt und Remis.']},
 {v:'2026-11-20.2',t:'Banana Boost: neue Grafik, Eisabfahrt und Kakteen',items:['Das Kart-Rennen sieht jetzt viel besser aus: runde Karts, Himmel mit Sonne und Wolken, Berge, Bäume und Zielbanner.','Die Eisabfahrt ist jetzt eine einzige lange Abfahrt den Berg hinunter, kein Rundkurs mehr. Eisblöcke auf der Strecke bremsen dich stark ab.','In der Wüstenschlange stehen Kakteen am Rand. Wer sie berührt, wird langsamer.']},
 {v:'2026-11-19.8',t:'Admin-Center: Details, Bücher-Zugriff und sicheres Löschen',items:['Im Admin-Center kommst du jetzt mit einem Klick auf jeden Namen zum Profil. Oben siehst du, wie viele Admins, Moderatoren und Schüler es gibt.','Der Admin kann jeder Person den Zugriff auf die Bücherbibliothek geben oder wegnehmen. Wer keinen Zugriff hat, kann den Admin mit einem Knopf anschreiben und bekommt einen Hinweis, sobald er freigeschaltet ist.','Accounts löschen geht jetzt nur noch nach einer Sicherheitsfrage und mit einem Lösch-Passwort.']},
 {v:'2026-11-19.7',t:'Kart-Rennen: Bestenliste und Vollbild',items:['Neu: Bestenliste. Deine schnellste Zeit pro Strecke wird gespeichert, du siehst die Zeiten aller Spieler.','Das Kart-Rennen läuft jetzt im Vollbild. Mit „Vollbild beenden“ oder Menü kommst du zurück.']},
 {v:'2026-11-19.6',t:'Kart-Rennen: Auswahl und neue Steuerung',items:['Neuer Startbildschirm Banana Boost mit Animation. Danach wählst du Auto, Charakter (Hautton und Farbe) und zuletzt die Strecke.','Die Autos haben unterschiedliche Werte für Tempo, Start und Lenkung.','Steuerung: Links lenken, rechts Gas und Bremse. Am PC mit den Pfeiltasten, Gas gibst du jetzt selbst.','Bei Spiele ist der Knopf „Mit Freunden“ weg. Den Modus stellst du direkt im Spiel ein.']},
 {v:'2026-11-19.5',t:'Kart-Rennen: größere Strecken und Bereit-Knopf',items:['Drei neue, deutlich größere Strecken mit Haarnadelkurven und Schlangenlinien.','Die Eisabfahrt ist rutschig: Dein Kart driftet in den Kurven, das ist schwerer.','Auf allen Strecken liegen Ölflecken. Wer hineinfährt, dreht sich und wird langsamer.','Vor dem Start muss jeder auf „Bereit“ tippen. Sind alle bereit, zählt der Countdown von 3 herunter.']},
 {v:'2026-11-19.4',t:'Kart-Rennen in 3D',items:['Das Kart-Rennen ist jetzt in 3D: Du fährst hinter deinem Kart über Strecken mit Bäumen, Bande und Startbogen.','Du wählst Gegen Computer oder Mehrspieler. Die Karte findest du bei Spiele neben Tic Tac Toe.']},
 {v:'2026-11-19.3',t:'Kart-Rennen',items:['Neu bei Spiele: Kart-Rennen mit 3 Strecken (Wiesenring, Wüstenschlange, Eisgipfel) und 3 Runden.','Allein fährst du gegen 3 Computer-Fahrer. Mit einem Raumcode fährst du online mit Freunden und kannst sie direkt einladen.','Steuern: Pfeiltasten oder die Knöpfe unter dem Spielfeld, Gas ist automatisch.']},
 {v:'2026-11-19.2',t:'Neuer Lesemodus',items:['Bücher, Stoff und Mitschriften öffnest du jetzt im Lesemodus: Tippe auf das Buch oder auf „Lesemodus“. Er füllt den ganzen Bildschirm.','Auf dem iPad siehst du zwei Seiten nebeneinander. Mit dem Finger wischst du flüssig weiter, die Seiten laufen mit deinem Finger mit.','Mit zwei Fingern zoomst du, mit einem Finger verschiebst du die Seite. Doppeltippen zoomt rein und wieder raus.','Verlassen kannst du den Lesemodus mit dem × oben links oder indem du nach unten wischst.']},
 {v:'2026-11-19.1',t:'Gruppen und Weiterleiten',items:['Neu: Gruppen zum Chatten. Öffentliche Gruppen erstellen nur Moderatoren und Admins, jeder kann ohne Passwort beitreten.','Private Gruppen kann jeder erstellen. Man tritt nur mit Gruppenname und Passwort bei.','Gruppen kannst du bearbeiten: Name, Beschreibung, Gruppenbild und Passwort.','Stoff, Mitschriften und Bücher kannst du jetzt an Freunde oder Gruppen weiterleiten. Du findest den Knopf beim Ansehen.']},
 {v:'2026-11-18.3',t:'Online spielen, Rollen-Hinweise und neues Dashboard',items:['Tic Tac Toe kannst du jetzt online mit Freunden spielen, jeder an seinem eigenen Gerät. Du siehst sofort, wer dran ist, und bekommst einen Hinweis, wenn du am Zug bist.','Wenn dir der Admin eine neue Rolle gibt, zum Beispiel Moderator, bekommst du einen Hinweis mit der neuen Rolle.','Das Dashboard zeigt jetzt, was neu ist: neue Bücher, Stoff, Stapel, Nachrichten, Anfragen, Spielzüge und Updates. Der Stundenplan ist nicht mehr dort. Du findest ihn weiter auf der Startseite.','Du kannst deinen Benutzernamen ändern. Das geht unter Einstellungen im Reiter Konto. Danach meldest du dich mit dem neuen Namen an.','Im Profil gibt es jetzt Verläufe für den Hintergrund zum Auswählen: Orange, Schwarz, Grau, Pink, Blau, Lila, Grün und Sonnenuntergang.']},
 {v:'2026-11-18.2',t:'Reaktionen, Kommentare, Chat-Bilder und Spiele',items:['Bei Stoff und Mitschriften kannst du jetzt mit Emojis reagieren und Kommentare schreiben.','Im Chat kannst du Bilder an Freunde schicken. Nur ihr beide seht sie.','Neu auf der Startseite: Spiele. Es gibt Tic Tac Toe gegen den Computer oder zu zweit an einem Gerät.']},
 {v:'2026-11-18.1',t:'Vokabeln, Noten und viele Verbesserungen',items:['Neu: Vokabeln. Unter Lernmaterial legst du Karteikarten-Stapel an, übst sie und siehst am Ende jeder Runde, wie viele richtig waren. Stapel kannst du für andere freigeben.','Neu: Noten. Im Dashboard trägst du Noten oder MSS-Punkte in eine Tabelle ein und bekommst Statistiken zu Durchschnitt, Fächern, Verteilung und Verlauf.','Stundenplan: Jetzt mit 11 Stunden pro Tag. Der Farbkreis ist weg, damit sich Farben nicht mehr ändern. Ethik, Evangelisch und Katholisch sind hellblau.','Schulbücher, Stoff und Mitschriften: Das Bundesland muss nicht mehr gewählt werden.','Admin: Accounts können gelöscht werden.','Die Seite heißt jetzt STUDIQ.']},
 {v:'2026-11-17.3',t:'Benachrichtigungen und mehr Farben',items:['Neue Glocke oben rechts: Sie zeigt neue Nachrichten und Freundschaftsanfragen.','Hinweise im Browser kannst du unter Benachrichtigungen einschalten. Sie funktionieren, solange die Seite im Browser geöffnet ist.','Bücher, Stoff und Mitschriften haben jetzt 14 Farben vom Regenbogen bis Schwarz und Weiß, dazu eine eigene Farbe.','Dieses Fenster zeigt dir ab jetzt nach jedem Update, was neu ist.']},
 {v:'2026-11-17.2',t:'Schulen, Code und Nachrichten',items:['Jede Person hat einen 6-stelligen Code, mit dem man sie als Freund hinzufügen kann.','Du kannst deinen Freunden Nachrichten schreiben.','Schulen mit Schülerlisten. Nur der Admin legt Schulen an.','Profile mit Profilbild, Hintergrundbild, Stufe und Schule.']}
];
function showSplash(force){
 if(!force&&S.seenV==VERSION)return;
 document.querySelector('.splash')?.remove();
 const i=CHANGELOG.findIndex(c=>c.v==S.seenV),l=force||i<=0?CHANGELOG.slice(0,2):CHANGELOG.slice(0,i);
 const d=document.createElement('div');d.className='splash';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Willkommen bei STUDIQ');
 d.innerHTML=`<div class="card"><p class="m" style="margin:0">Version ${esc(VERSION)}</p><h1 style="margin-top:4px">Willkommen bei STUDIQ</h1><h2 style="font-size:17px;margin:14px 0 4px">Wofür ist STUDIQ da?</h2><p style="margin:0">STUDIQ ist deine Lernplattform für die Schule. Du findest Schulbücher und Lernmaterial online, teilst Mitschriften, übst Vokabeln mit Karteikarten, behältst deine Noten im Blick, führst deinen Stundenplan und bleibst mit Freunden und Mitschülern in Kontakt.</p><p style="margin:14px 0 0;padding:12px 14px;border-radius:14px;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))"><b>Noch nicht fertig.</b> Die Seite wird noch weiterentwickelt. Es kann Fehler geben, und einiges ändert sich noch.</p><h2 style="margin:22px 0 0">Was ist neu?</h2>${l.map(c=>`<h3 style="font:500 16px Inter,system-ui,sans-serif;margin:16px 0 4px">${esc(c.t)}</h3><ul style="padding-left:20px;margin:0">${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}<p style="margin:22px 0 0"><button class="btn o" id="spb">Alles klar</button></p></div>`;
 const close=()=>{sv('seenV',VERSION);d.remove()};
 document.body.append(d);$('#spb').onclick=close;d.onclick=e=>{if(e.target==d)close()};
}

/* ===== Daten laden ===== */
async function loadItems(){
 const{data,error}=await sb.from('items').select('*, pages(count)').order('created_at',{ascending:false});
 if(error){toast('Die Inhalte konnten nicht geladen werden.');return}

/* ===== Spiele: Tic Tac Toe ===== */
const WINL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const tWin=b=>{for(const[a,c,d]of WINL)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return{w:b[a],l:[a,c,d]};return b.every(x=>x)?{w:'D',l:[]}:null};
function mm(b,turn,d){
 const r=tWin(b);if(r)return r.w=='O'?10-d:r.w=='X'?d-10:0;
 let best=turn=='O'?-99:99;
 for(let i=0;i<9;i++)if(!b[i]){b[i]=turn;const s=mm(b,turn=='O'?'X':'O',d+1);b[i]='';best=turn=='O'?Math.max(best,s):Math.min(best,s)}
 return best
}
function cpuMove(){
 const b=TT.b,free=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
 if(TT.lvl=='easy'&&Math.random()<.6)return free[Math.random()*free.length|0];
 let best=-99,mv=[];
 for(const i of free){b[i]='O';const s=mm(b,'X',1);b[i]='';if(s>best){best=s;mv=[i]}else if(s==best)mv.push(i)}
 return mv[Math.random()*mv.length|0]
}
function ttNew(prev,mode,lvl){
 const keep=prev&&!mode&&!lvl,start=keep?(prev.start=='X'?'O':'X'):'X',m=mode||(prev&&prev.mode)||'cpu';
 TT={b:Array(9).fill(''),turn:start,start,mode:m,lvl:lvl||(prev&&prev.lvl)||'hard',over:false,res:null,sc:keep?prev.sc:{X:0,O:0,D:0}};
 if(m=='cpu'&&start=='O')ttCpuLater()
}
function ttCpuLater(){const t=TT;setTimeout(()=>{if(TT!==t||t.over)return;t.b[cpuMove()]='O';ttAfter()},400)}
function ttAfter(){
 const r=tWin(TT.b);
 if(r){TT.over=true;TT.res=r;TT.sc[r.w]++;if(TT.mode=='cpu'){if(r.w=='X')bkEarn('ttt',TT.lvl=='hard'?6:3,null,'Sieg gegen den Computer');else if(r.w=='D'&&TT.lvl=='hard')bkEarn('ttt',1,null,'Unentschieden')}render();return}
 TT.turn=TT.turn=='X'?'O':'X';render();
 if(TT.mode=='cpu'&&TT.turn=='O')ttCpuLater()
}
function ttPlay(i){
 if(!TT||TT.over||TT.b[i]||(TT.mode=='cpu'&&TT.turn=='O'))return;
 TT.b[i]=TT.turn;ttAfter()
}
const ttNext=()=>{ttNew(TT);render()};
const ttMode=m=>{ttNew(TT,m);render()};

async function tMove(i){
 const g=GAMES.find(x=>x.id==P.g);if(!g||g.result)return;
 const me=g.x==ME.id?'X':'O';if(g.turn!=me)return;
 const b=g.board.split('');if(b[i]!='-')return;
 const old={...g};b[i]=me;g.board=b.join('');g.turn=me=='X'?'O':'X';

async function czBj(a){if(CZ.busy||CZ.gid!='blackjack')return;const w=WL[ME.id]||(WL[ME.id]={user_id:ME.id,balance:0,total:0,pub:false});
 if(a=='start'&&+w.balance<CZ.bet)return czMsg('Dafür hast du nicht genug Bookies.','#ff6b6b');
 CZ.busy=1;czMsg('');czSfx('tick');const f={start:['casino_bj_start',{p_bet:CZ.bet}],hit:['casino_bj_hit',{}],stand:['casino_bj_stand',{}],double:['casino_bj_double',{}]}[a],{data,error}=await sb.rpc(f[0],f[1]);CZ.busy=0;
 if(error||!data){console.error(error);return czMsg(needSql(error)?'Bitte führe zuerst update18.sql in Supabase aus.':/Zu wenige/.test((error&&error.message)||'')?'Nicht genug Bookies.':'Das hat nicht geklappt.','#ff6b6b')}

 if(data.done){const win=+data.payout,net=win-data.bet,msg={blackjack:'Blackjack! ',win:'Gewonnen! ',push:'Unentschieden. ',lose:'Verloren. ',bust:'Über 21, verloren. '}[data.result]||'';
  czMsg(msg+(net>0?'+'+bkn(net)+' Bookies':net==0?'Einsatz zurück.':''),net>0?'#8fe04a':net==0?'#ffd43b':'#ff9b9b');if(net>0)czSfx('win');

  if(data.result=='blackjack'){CZ.em={id:8,t0:performance.now()};clearTimeout(CZ.emt);CZ.emt=setTimeout(()=>{if(CZ.em&&CZ.em.id==8)CZ.em=null},4600)}
  czFeed('Du: Blackjack '+(net>=0?'+':'')+bkn(net))}}

function czOpen(id){if(CZ.panel||!CZG[id])return;if(id=='blackjack')return czBjOpen();CZ.panel=1;CZ.gid=id;CZ.pick=null;CZ.jx=CZ.jy=0;CZ.keys={};const g=CZG[id],p=$('#cpanel');
 if(CZ.bet>czBal())CZ.bet=Math.max(5,CZ_CHIPS.filter(c=>c<=czBal()).pop()||5);
 const stage={roulette:'<div class="czrn" id="czs1">?</div>',dice:'<div class="czdc"><span id="czs1">⚀</span><span id="czs2">⚀</span></div>',coin:'<div class="czcn" id="czs1">🪙</div>',slots:'<div class="czrl"><span id="czs1">🍒</span><span id="czs2">🍌</span><span id="czs3">🔔</span></div>',

 p.innerHTML=`<div class="czp"><div class="czh"><h2>${g.e} ${g.n}</h2><button class="czx" onclick="czClose()" aria-label="Schließen">✕</button></div><div class="czb2">Kontostand: <b id="czbal">🍌 ${bkn(czBal())}</b></div><div class="czst">${stage}</div>${g.picks?`<div class="czpk">${g.picks.map(([k,l,m])=>`<button data-k="${k}" onclick="czPick('${k}')">${l}<small>${m}</small></button>`).join('')}</div>`:''}${g.num?`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="number" id="czn" min="0" max="36" placeholder="0–36"><button class="btn g" style="padding:8px 14px" onclick="czNum()">Auf Zahl setzen (36×)</button></div>`:''}<label>Einsatz</label><div class="czch">${CZ_CHIPS.map(c=>`<button data-c="${c}" class="${c==CZ.bet?'on':''}" onclick="czBet(${c})">${c}</button>`).join('')}</div><button class="btn o" id="czgo" style="width:100%" onclick="czPlay()">Spielen</button><div class="czm" id="czmsg"></div><p>${g.d}</p></div>`;p.style.display='grid'}

function czRoll(){const g=CZ.gid;if(g=='wheel')return 0;return setInterval(()=>{const a=$('#czs1'),b=$('#czs2'),c=$('#czs3');if(!a)return;if(g=='roulette'){const n=Math.random()*37|0;a.textContent=n;a.style.background=czRc(n)}else if(g=='dice'){a.textContent=CZ_DIC[Math.random()*6|0];b.textContent=CZ_DIC[Math.random()*6|0]}else if(g=='coin'){a.textContent=CZ.cf=!CZ.cf?'🍌':'👑'}else{const k=Object.values(CZ_SYM);a.textContent=k[Math.random()*7|0];b.textContent=k[Math.random()*7|0];c.textContent=k[Math.random()*7|0]}},80)}

 if(g=='roulette'){a.textContent=r.n;a.style.background=czRc(r.n)}else if(g=='dice'){a.textContent=CZ_DIC[r.a-1];b.textContent=CZ_DIC[r.b-1]}else if(g=='coin')a.textContent=r.s=='banana'?'🍌':'👑';else{a.textContent=CZ_SYM[r.s[0]];b.textContent=CZ_SYM[r.s[1]];c.textContent=CZ_SYM[r.s[2]]}}
async function czPlay(){
 if(CZ.busy||!CZ.gid)return;const id=CZ.gid,g=CZG[id],bet=CZ.bet,w=WL[ME.id]||(WL[ME.id]={user_id:ME.id,balance:0,total:0,pub:false});
 if(g.picks&&!CZ.pick)return czMsg('Wähle zuerst eine Option.','#ffb21f');

 CZ.busy=1;czMsg('');const gb=$('#czgo');if(gb)gb.disabled=true;const iv=czRoll(),t0=Date.now();czSfx('tick');
 const{data,error}=await sb.rpc('casino_play',{p_game:id,p_bet:bet,p_pick:CZ.pick||null});
 if(error||!data){clearInterval(iv);CZ.busy=0;const b=$('#czgo');if(b)b.disabled=false;console.error(error);return czMsg(needSql(error)?'Bitte führe zuerst update17.sql in Supabase aus.':/Zu wenige/.test((error&&error.message)||'')?'Nicht genug Bookies.':'Das hat nicht geklappt.','#ff6b6b')}
 if(id=='wheel'){czShow(id,data.r);await new Promise(r=>setTimeout(r,3300))}else{await new Promise(r=>setTimeout(r,Math.max(0,1500-(Date.now()-t0))));clearInterval(iv);czShow(id,data.r)}
 CZ.busy=0;const b=$('#czgo');if(b)b.disabled=false;w.balance=data.balance;const win=+data.payout,net=win-bet;
 czMsg(win>bet?'Gewonnen! +'+bkn(net)+' Bookies':win==bet?'Einsatz zurück.':win>0?bkn(win)+' zurück.':'Leider verloren.',win>bet?'#8fe04a':win>0?'#ffd43b':'#ff9b9b');
 const bl=$('#czbal');if(bl)bl.textContent='🍌 '+bkn(data.balance);
 if(data.gold){CZ.gold[ME.id]=data.gold_n||(CZ.gold[ME.id]||0)+1;czGoldFx()}
 if(win>bet)czSfx('win');
 if(CZ.ch)CZ.ch.send({type:'broadcast',event:'w',payload:{id:ME.id,n:nm(ME.id),g:id,bet,win,gold:data.gold?1:0}});
 if(win>=bet*5||data.gold){CZ.em={id:8,t0:performance.now()};clearTimeout(CZ.emt);CZ.emt=setTimeout(()=>{if(CZ.em&&CZ.em.id==8)CZ.em=null},4600)}
 czFeed('Du: '+g.n+' '+(net>=0?'+':'')+bkn(net))}
function czGoldFx(){const g=$('#cgame');if(!g)return;const d=document.createElement('div');d.className='cgold';d.innerHTML='🏆<br>GOLDENE BANANE!';g.append(d);setTimeout(()=>d.remove(),3700);czSfx('gold')}


/* ===== Bananen-Memory: schnelles Memory-Rennen mit Freunden ===== */
const BM_EM=['🍌','🍍','🥥','🍒','🍓','🍇','🍉','🍋','🥭','🍑'];
let BM={st:'idle',p:{},tot:{},rd:0};
function bmRng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bmShuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bmInit(){bmStop();BM={st:'lobby',p:{},tot:{},rd:0,room:'',fin:{},prog:{},k:0,cards:[]};BM.chk=setInterval(()=>{if(V!='bmem'||!$('#bm'))bmStop()},1000);bmDraw()}
function bmStop(){['chk','hi','cdi','ti','to','gt'].forEach(k=>{if(BM[k]){clearInterval(BM[k]);clearTimeout(BM[k]);BM[k]=0}});if(BM.ch){sb.removeChannel(BM.ch);BM.ch=null}BM.st='idle'}
function bmHello(){if(!BM.ch)return;BM.ch.send({type:'broadcast',event:'j',payload:{id:ME.id,n:nm(ME.id)}});const t=performance.now();let ch=0;for(const id in BM.p)if(t-BM.p[id].t>7000){delete BM.p[id];ch=1}if(ch&&BM.st=='lobby')bmDraw()}
function bmNet(r){if(BM.ch){sb.removeChannel(BM.ch);BM.ch=null}clearInterval(BM.hi);BM.room=r;BM.p={};if(!r)return;
 BM.ch=sb.channel('bmem:'+r)
  .on('broadcast',{event:'j'},m=>{const q=m.payload;if(q&&q.id!=ME.id){const n=!BM.p[q.id];BM.p[q.id]={n:q.n,t:performance.now()};if(n&&BM.st=='lobby')bmDraw()}})
  .on('broadcast',{event:'go'},m=>{const q=m.payload;if(q&&BM.st!='play'&&BM.st!='count')bmStart(q.seed,q.rd)})
  .on('broadcast',{event:'pr'},m=>{const q=m.payload;if(q&&q.id!=ME.id){BM.prog[q.id]={n:q.n,k:q.k};bmHud()}})
  .on('broadcast',{event:'fn'},m=>{const q=m.payload;if(q&&q.id!=ME.id){BM.fin[q.id]={n:q.n,t:q.t};bmCheck()}})
  .subscribe(()=>bmHello());BM.hi=setInterval(bmHello,2000)}
function bmRand(){const r=Math.random().toString(36).slice(2,6);$('#bmr').value=r;bmNet(r);toast('Raum '+r+' ist offen.')}
function bmJoin(){const r=$('#bmr').value.trim().toLowerCase();bmNet(r);toast(r?'Verbunden mit Raum '+r+'.':'Du spielst allein.')}
async function bmInv(){const id=$('#bmf')?.value;if(!id)return toast('Du hast noch keine Freunde.');let r=$('#bmr').value.trim();if(!r){bmRand();r=$('#bmr').value}else bmNet(r.toLowerCase());
 const{error}=await sb.from('messages').insert({recipient:id,body:`🍌 Bananen-Memory! Öffne Spiele, tippe auf Bananen-Memory und gib den Raumcode „${r}“ ein.`});toast(error?'Die Einladung ging nicht raus.':'Einladung gesendet.')}
function bmGo(){if(BM.rd>=3){BM.rd=0;BM.tot={}}const seed=Math.random()*1e9|0;if(BM.ch)BM.ch.send({type:'broadcast',event:'go',payload:{seed,rd:BM.rd}});bmStart(seed,BM.rd)}
function bmStart(seed,rd){clearTimeout(BM.to);clearTimeout(BM.gt);clearInterval(BM.cdi);BM.rd=rd;if(rd==0)BM.tot={};const r=bmRng(seed),es=bmShuf(BM_EM,r).slice(0,8);BM.cards=bmShuf([...es,...es],r).map(e=>({e,o:0,d:0}));
 BM.fin={};BM.prog={};BM.k=0;BM.first=-1;BM.lock=0;BM.pl=[ME.id,...Object.keys(BM.p)];BM.st='count';BM.cd=3;bmDraw();
 BM.cdi=setInterval(()=>{BM.cd--;if(BM.cd<=0){clearInterval(BM.cdi);BM.st='play';BM.t0=performance.now();BM.to=setTimeout(bmEnd,90000);BM.ti=setInterval(()=>{const e=$('#bmt');if(e)e.textContent=((performance.now()-BM.t0)/1000).toFixed(1)+' s'},100)}bmDraw()},1000)}
function bmFlip(i){if(BM.st!='play'||BM.lock)return;const c=BM.cards[i];if(c.o||c.d)return;c.o=1;
 if(BM.first<0){BM.first=i;bmDraw();return}
 const a=BM.cards[BM.first],f=BM.first;BM.first=-1;
 if(a.e==c.e){a.d=c.d=1;a.o=c.o=0;BM.k++;if(BM.ch)BM.ch.send({type:'broadcast',event:'pr',payload:{id:ME.id,n:nm(ME.id),k:BM.k}});bmDraw();if(BM.k==8)bmFinish()}
 else{BM.lock=1;bmDraw();setTimeout(()=>{a.o=c.o=0;BM.lock=0;bmDraw()},650)}}
function bmFinish(){clearInterval(BM.ti);const t=Math.round(performance.now()-BM.t0);BM.fin[ME.id]={n:nm(ME.id),t};if(BM.ch)BM.ch.send({type:'broadcast',event:'fn',payload:{id:ME.id,n:nm(ME.id),t}});BM.st='wait';bmDraw();bmCheck()}
function bmCheck(){if(BM.st!='play'&&BM.st!='wait')return;if(!BM.gt&&Object.keys(BM.fin).length)BM.gt=setTimeout(bmEnd,40000);if(BM.pl.every(id=>BM.fin[id]))setTimeout(bmEnd,500);else bmHud()}
function bmEnd(){if(BM.st!='play'&&BM.st!='wait')return;clearInterval(BM.ti);clearTimeout(BM.to);clearTimeout(BM.gt);
 Object.entries(BM.fin).sort((a,b)=>a[1].t-b[1].t).forEach(([id,f],i)=>{const t=BM.tot[id]||(BM.tot[id]={n:f.n,p:0});t.p+=[3,2,1][i]||0});
 BM.pl.forEach(id=>{if(!BM.tot[id])BM.tot[id]={n:id==ME.id?nm(ME.id):(BM.p[id]||{}).n||'Spieler',p:0}});BM.rd++;BM.st='res';bmDraw()}
function bmHud(){const e=$('#bmh');if(!e)return;e.innerHTML=Object.entries(BM.prog).map(([id,p])=>`<span>${esc(p.n)}: ${BM.fin[id]?'fertig':p.k+'/8'}</span>`).join('')}
function bmDraw(){const e=$('#bm');if(!e)return;const s=BM.st;let h='';
 if(s=='lobby'){const ps=Object.values(BM.p).map(p=>p.n);h=`<div class="card"><h3 style="margin-top:0">Wer spielt mit?</h3><div class="bar"><input id="bmr" maxlength="12" placeholder="Raumcode (leer = allein)" value="${esc(BM.room)}"><button class="btn g" onclick="bmRand()">Zufall</button><button class="btn g" onclick="bmJoin()">Verbinden</button></div><div class="bar"><select id="bmf">${frs().friends.map(id=>`<option value="${id}">${esc(nm(id))}</option>`).join('')}</select><button class="btn g" onclick="bmInv()">Einladen</button></div><div class="bmp"><span>👤 Du</span>${ps.map(n=>`<span>👤 ${esc(n)}</span>`).join('')}</div><p style="text-align:center;margin:14px 0 0"><button class="btn o" style="font-size:18px;padding:12px 32px" onclick="bmGo()">Runde starten</button></p></div>`}
 else if(s=='count')h=`<div class="bmn">${BM.cd}</div><p class="m" style="text-align:center">Runde ${BM.rd+1} von 3. Mach dich bereit!</p>`;
 else if(s=='play'||s=='wait'){h=`<div class="bmt" id="bmt">${s=='wait'?(BM.fin[ME.id].t/1000).toFixed(1)+' s':'0.0 s'}</div><div class="bmg">${BM.cards.map((c,i)=>`<button class="bmk${c.o?' o':''}${c.d?' d':''}" onclick="bmFlip(${i})">${c.o||c.d?c.e:'?'}</button>`).join('')}</div><div class="bmp" id="bmh"></div><p class="m" style="text-align:center">${s=='wait'?'Geschafft! Warte auf die anderen …':'Finde alle 8 Paare, so schnell du kannst.'}</p>`}
 else{const fin=Object.entries(BM.fin).sort((a,b)=>a[1].t-b[1].t),tot=Object.entries(BM.tot).sort((a,b)=>b[1].p-a[1].p),end=BM.rd>=3;
  h=`<div class="card"><h3 style="margin-top:0">${end?'🏆 Endstand':'Ergebnis Runde '+BM.rd}</h3>${end?`<p style="font-size:18px"><b>${esc(tot[0][1].n)}</b> gewinnt mit ${tot[0][1].p} Punkten!</p>`:''}<table class="bmr" style="width:100%;border-collapse:collapse"><tr><th>Platz</th><th>Name</th><th>Zeit</th><th>Gesamt</th></tr>${fin.map(([id,f],i)=>`<tr><td>${i+1}</td><td>${esc(f.n)}</td><td>${(f.t/1000).toFixed(1)} s</td><td>${(BM.tot[id]||{p:0}).p}</td></tr>`).join('')}${tot.filter(([id])=>!BM.fin[id]).map(([id,t])=>`<tr><td>–</td><td>${esc(t.n)}</td><td>nicht fertig</td><td>${t.p}</td></tr>`).join('')}</table><p style="text-align:center;margin:14px 0 0"><button class="btn o" onclick="bmGo()">${end?'Neues Spiel':'Nächste Runde'}</button> <button class="btn g" onclick="go('spiele')">Beenden</button></p></div>`}
 e.innerHTML=h;if(s=='play'||s=='wait')bmHud()}
/* Barkeeper Bruno: Gespräch (optional mit KI über die Edge Function „barkeeper“, sonst eingebaut) */
const CZ_FU=['Wie läuft es gerade in der Schule?','Gibt es ein Fach, das dir Sorgen macht?','Hast du bald eine Klausur oder einen Test?','Kommst du mit den Hausaufgaben klar?','Verstehst du dich gut mit deiner Klasse?','Gibt es etwas, das dich gerade beschäftigt?'];
function czBrain(t){const q=t.toLowerCase(),pick=a=>a[Math.random()*a.length|0],fu=()=>{CZ.fi=((CZ.fi||0)+1)%CZ_FU.length;return ' '+CZ_FU[CZ.fi]},has=r=>r.test(q);
 if(has(/umbring|suizid|selbstmord|nicht mehr leben|sterben (will|möchte)|will sterben|mich töten|ritz/))return 'Das klingt wirklich ernst, und ich bin froh, dass du es sagst. Bitte sprich jetzt mit einem Erwachsenen, dem du vertraust, zum Beispiel mit deinen Eltern, einer Lehrkraft oder der Schulsozialarbeit. Du kannst auch kostenlos die „Nummer gegen Kummer“ anrufen: 116 111 (für Kinder und Jugendliche). Die Telefonseelsorge ist rund um die Uhr erreichbar: 0800 111 0 111. Wenn du dich in Gefahr fühlst, ruf bitte sofort die 112 an. Du bist nicht allein.';
 if(has(/mobb|gemobbt|ausgegrenzt|ausgelacht|schlägt mich|bedroh|gehänselt/))return pick(['Das tut mir leid, so etwas darf nicht sein. Du hast nichts falsch gemacht. Sag es bitte einem Erwachsenen, dem du vertraust, zum Beispiel einer Lehrkraft, deinen Eltern oder der Schulsozialarbeit. Wenn du lieber erst anonym reden willst: Die „Nummer gegen Kummer“ ist kostenlos unter 116 111 erreichbar.','Danke, dass du mir das erzählst. Mobbing ist nie deine Schuld. Schreib am besten auf, was passiert ist, und zeig es einer Lehrkraft oder deinen Eltern. Du musst das nicht allein aushalten. Die „Nummer gegen Kummer“ (116 111) hört dir kostenlos zu.'])+' Magst du mir erzählen, was passiert ist?';

hwv:()=>{const h=HW.list.find(x=>x.id==P.id);if(!h)return '<h1>Hausaufgabe</h1><p class="m">Diese Hausaufgabe gibt es nicht mehr.</p>';const d=HW.done.has(h.id),bkI=h.book_id&&DB.find(x=>String(x.id)==h.book_id),own=h.created_by==ME.id||ME.role=='admin',R=(a,b)=>b?`<div class="row"><span class="m">${a}</span><span>${b}</span></div>`:'';
 const kl=h.kind=='klausur',ex=Array.isArray(h.exam_items)?h.exam_items:[];return `<h1>${esc(h.fach)}${kl?'<span class="hwk" style="font-size:15px">Klausur</span>':''}</h1><div class="hwr ${kl&&!d?'kl':''} ${d?'ok':''}" style="cursor:default"><button class="hwc" aria-label="${d?'Als offen markieren':'Als erledigt markieren'}" onclick="hwTog('${h.id}')">${d?'✓':''}</button><div class="hwt"><b>${d?(kl?'Vorbereitet':'Erledigt'):'Noch offen'}</b><small>Tippe auf den Kreis, um es für dich abzuhaken.</small></div></div><div class="card" style="max-width:none;padding:8px 24px 20px"><div class="row"><span class="m">${kl?'Datum':'Fällig'}</span><b style="font-weight:500">${hwLong(h.due)}</b></div>${R('Lehrer',esc(h.teacher||''))}${R('Kurs',h.course=='LK'?'Leistungskurs (LK)':h.course=='GK'?'Grundkurs (GK)':'')}${R('Link',/^https?:\/\//i.test(h.link||'')?`<a href="${esc(h.link)}" target="_blank" rel="noopener noreferrer">${esc(h.link.replace(/^https?:\/\/(www\.)?/i,'').slice(0,50))}</a>`:'')}${R('Buch',h.book_title?esc(h.book_title)+(bkI?` <button class="btn g" style="margin-left:8px;padding:4px 14px" onclick="go('view',{id:'${bkI.id}'})">Öffnen</button>`:''):'')}${R('Seite',esc(h.page))}${R('Aufgabe',esc(h.task))}${kl&&h.exam_topics?`<p style="white-space:pre-wrap;margin:16px 0 0"><b style="font-weight:500">Themen:</b> ${esc(h.exam_topics)}</p>`:''}${kl&&ex.length?`<p class="m" style="margin:16px 0 8px">Wichtiger Stoff, tippe zum Öffnen</p><div class="chips">${ex.map(o=>DB.some(x=>String(x.id)==String(o.id))?`<span class="chip" role="button" tabindex="0" onclick="go('view',{id:'${o.id}'})">📌 ${esc(o.title)}</span>`:`<span class="chip">${esc(o.title)}</span>`).join('')}</div>`:''}${h.descr?`<p style="white-space:pre-wrap;margin:16px 0 0">${esc(h.descr)}</p>`:''}${h.image_path?`<img class="hwi" id="hwimg" alt="Bild zur Hausaufgabe" style="display:none">`:''}<p class="m" style="margin:16px 0 0">Eingetragen von ${esc(nm(h.created_by))}</p>${own?`<div class="bar" style="margin-bottom:0"><button class="btn g" onclick="hwEdit('${h.id}')">Bearbeiten</button><button class="btn g" onclick="hwDel('${h.id}')">Löschen</button></div>`:''}</div><h2>Kommentare</h2><div class="card" style="max-width:none;padding:6px 24px 4px"><div id="hwcm">${hwCmH(h)}</div><div class="bar" style="margin:12px 0"><input id="hwci" maxlength="1000" style="flex:1;min-width:160px" placeholder="Kommentar schreiben" aria-label="Kommentar" onkeydown="event.key=='Enter'&&hwCom('${h.id}')"><button class="btn o" onclick="hwCom('${h.id}')">Senden</button></div></div>`},
admin:()=>`<h1>Admin</h1><p class="m">Lege hier fest, was jede Person sehen und tun darf. Moderatoren dürfen Schulbücher hochladen. Tippe auf einen Namen, um das Profil zu öffnen.</p>${astats()}${areqs()}<h2>Personen</h2><div class="bar"><input placeholder="Name suchen" aria-label="Name suchen" value="${esc(A.q)}" oninput="A.q=this.value;$('#al').innerHTML=arows()"><span class="chip ${A.fr?'on':''}" onclick="A.fr=!A.fr;render()">Nur Freunde</span></div><div class="card" id="al" style="padding:6px 24px;max-width:none">${arows()}</div>`,
dash:()=>{const nn=DB.filter(x=>!ME.stufe||x.stufe==ME.stufe).slice(0,4),ev=feed();return `<h1>Hallo, ${esc(dn(ME))}</h1><p class="m">Das ist neu.</p><div class="card" style="padding:6px 24px;max-width:none;margin-top:12px">${ev.length?ev.map(e=>`<div class="row" ${e.go?`style="cursor:pointer" onclick="${e.go}"`:''}><span>${e.h}<br><span class="m" style="font-size:13px">${ago(e.t)}</span></span>${e.go?'<span class="m">›</span>':''}</div>`).join(''):'<p class="m">Gerade ist nichts Neues da.</p>'}</div><div class="tiles" style="margin:18px 0 0;max-width:none">${tl([['grade','Noten','Noten und MSS-Punkte mit Statistik','noten']])}</div><h2>Neu für dich</h2><div class="grid">${nn.map(card).join('')||'<p class="m">Noch nichts da.</p>'}</div>`},
lern:()=>`<h1>Lernmaterial</h1><p class="m">Was suchst du?</p><div class="tiles" style="margin-top:20px">${tl([['stoff','Stoff','Zusammenfassungen und Material','_stoff'],['notes','Mitschriften','Notizen und GoodNotes-PDFs','_notes'],['cards','Vokabeln','Karteikarten üben und erstellen','vokab']])}</div>`,
schule:()=>{const s=SCH.find(x=>x.id==ME.school_id);return `<h1>${esc(s?s.name:'Meine Schule')}</h1><p class="m">Hier findest du Schulen, Chat und Mitschüler.</p>${s?`<button class="btn g" onclick="go('schulv',{s:'${s.id}'})">Schüler an ${esc(s.name)}</button>`:`<button class="btn g" onclick="go('schulen')">Schule auswählen</button>`}<div class="tiles" style="margin-top:20px">${tl([['school','Schulen','Alle Schulen ansehen','schulen'],['chat','Chat','Nachrichten an Freunde','chat'],['chat','Gruppen','Öffentliche und private Gruppen','gruppen'],['user','Schülerliste','Öffentliche Profile','schueler'],['user','Freunde','Per Name oder Code','freunde']])}</div>`},
schulen:()=>`<h1>Schulen</h1><p class="m">Tippe auf eine Schule, um ihre Schüler zu sehen.</p>${ME.role=='admin'?`<div class="card"><label style="margin-top:0">Neue Schule (nur Admin)</label><div class="bar" style="margin:0"><input id="sn" placeholder="z. B. IGS Anna Seghers" onkeydown="event.key=='Enter'&&addSchool()"><button class="btn o" onclick="addSchool()">Hinzufügen</button></div></div>`:''}<div class="card" style="padding:6px 24px">${SCH.length?SCH.map(s=>`<div class="row" style="cursor:pointer" onclick="go('schulv',{s:'${s.id}'})"><span>${esc(s.name)}<span class="m">, ${PROF.filter(p=>p.school_id==s.id&&p.visible!==false&&p.role!='gesperrt').length} Schüler</span></span>${ME.role=='admin'?`<button class="btn g" onclick="event.stopPropagation();delSchool('${s.id}')">Löschen</button>`:''}</div>`).join(''):`<p class="m">Noch keine Schulen.${ME.role=='admin'?'':' Der Admin legt sie an.'}</p>`}</div>`,
schulv:()=>{const s=SCH.find(x=>x.id==P.s),l=PROF.filter(p=>p.school_id==s.id&&(p.visible!==false||p.id==ME.id)&&p.role!='gesperrt');return `<h1>${esc(s.name)}</h1><p class="m">${l.length} Schüler${ME.school_id==s.id?'. Das ist deine Schule.':''}</p>${ME.school_id==s.id?'':`<button class="btn o" onclick="svp('school_id','${s.id}');render()">Das ist meine Schule</button>`}<div class="card" style="padding:6px 24px;max-width:none">${l.length?l.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p.id}'})">${pn(p)}${p.klasse?`<span class="m">, Klasse ${esc(p.klasse)}</span>`:''}</span>${p.id==ME.id?'<span class="m">Du</span>':`<button class="btn ${ql(p)?'g':'o'}" onclick="rq('${p.id}')">${ql(p)||'Anfrage senden'}</button>`}</div>`).join(''):'<p class="m">Hier ist noch niemand.</p>'}</div>`},
schueler:()=>{const l=PROF.filter(p=>p.visible!==false&&p.id!=ME.id&&p.role!='gesperrt');return `<h1>Schülerliste</h1><p class="m">${ME.visible===false?'Du bist privat und erscheinst hier nicht.':'Du erscheinst hier öffentlich. Das änderst du in den Einstellungen.'}</p><div class="card" style="padding:6px 24px;max-width:none">${l.length?l.map(p=>`<div class="row"><span style="cursor:pointer;display:flex;gap:12px;align-items:center" onclick="go('person',{u:'${p.id}'})"><span class="frm ${fr(p)}" style="margin:0;position:relative">${isCre(p)?CRS:''}${onl(p,1)}<img src="${avOf(p)}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;display:block"></span><span>${pn(p)}${schn(p.school_id)?`<span class="m">, ${esc(schn(p.school_id))}</span>`:''}</span></span><button class="btn ${ql(p)?'g':'o'}" onclick="rq('${p.id}')">${ql(p)||'Anfrage senden'}</button></div>`).join(''):'<p class="m">Noch niemand da.</p>'}</div>`},
freunde:()=>{const f=frs();return `<h1>Freunde</h1><p class="m">Füge Leute über ihren Namen oder ihren 6-stelligen Code hinzu. Sie müssen nicht in der Schülerliste stehen.</p><div class="card"><p class="m" style="margin:0">Dein Code</p><h1 style="margin:2px 0 0;letter-spacing:.06em">${fmt(ME.code)}</h1><label>Name oder Code der Person</label><div class="bar" style="margin:0"><input id="fn" autocapitalize="none" placeholder="Name oder 000 000" onkeydown="event.key=='Enter'&&fadd()"><button class="btn o" onclick="fadd()">Anfrage senden</button></div></div>${ME.accept_requests===false?'<p class="m">Du erhältst gerade keine Anfragen. Das änderst du in den Einstellungen.</p>':f.inc.length?`<h2>Anfragen an dich</h2><div class="card" style="padding:6px 24px;max-width:none">${f.inc.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p}'})">${pn(byId(p))}</span><button class="btn o" onclick="facc('${p}')">Annehmen</button></div>`).join('')}</div>`:''}<h2>Deine Freunde</h2><div class="card" style="padding:6px 24px;max-width:none">${f.friends.length?f.friends.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p}'})">${pn(byId(p))}</span><button class="btn o" onclick="go('chat',{u:'${p}'})">Nachricht</button></div>`).join(''):'<p class="m">Noch keine Freunde.</p>'}</div>${f.sent.length?`<h2>Gesendet</h2><div class="card" style="padding:6px 24px;max-width:none">${f.sent.map(p=>`<div class="row"><span>${pn(byId(p))}</span><span class="m">Angefragt</span></div>`).join('')}</div>`:''}`},
plan:()=>{const t=(new Date().getDay()+6)%7,pl=PL.plan;return `<h1>Stundenplan</h1><p class="m">Tippe in ein Feld und trag dein Fach ein. Es wird automatisch in deinem Account gespeichert.</p><div class="plan"><span></span>${DAYS.map((d,i)=>`<b class="${i==t?'today':''}">${d}</b>`).join('')}${Array.from({length:ROWS},(_,r)=>`<span class="hr">${r+1}</span>${DAYS.map((_,c)=>`<div class="pc"><input class="${pl[c+'-'+r]?'f':''}" style="${cst(c+'-'+r,pl[c+'-'+r]||'')}" data-c="${cst(c+'-'+r,pl[c+'-'+r]||'')}" aria-label="${DAYS[c]}, ${r+1}. Stunde" value="${esc(pl[c+'-'+r]||'')}" oninput="ps('${c}-${r}',this)"></div>`).join('')}`).join('')}</div>`},
profil:()=>{const m=DB.filter(x=>x.by==ME.id);return phead(ME)+`<p class="m" style="text-align:center;margin-top:6px">${info(ME,1)}</p>${cre(ME.id)}<p style="text-align:center">Dein Code: <b>${fmt(ME.code)}</b> <span class="m">(zum Hinzufügen als Freund)</span></p><div class="card" style="padding:18px 24px"><p class="m" style="margin:0 0 12px">Profilbild</p><div class="chips" style="gap:12px;align-items:center">${AVATARS.map((a,i)=>`<img class="avc ${!ME.avu&&(ME.avatar_idx||0)==i?'on':''}" src="${a}" alt="Standardbild ${i+1}" onclick="pickAv(${i})">`).join('')}<label class="btn g" style="margin:0;font-size:15px">Eigenes Bild<input type="file" accept="image/*" hidden onchange="imgUp(this,'avatar')"></label>${ME.avatar_path?`<button class="btn g" onclick="rmImg('avatar')">Entfernen</button>`:''}</div><p class="m" style="margin:20px 0 12px">Hintergrund</p><div class="chips" style="gap:12px;align-items:center">${BANNERS.map(([n,g],i)=>`<span class="bnc ${bsel(ME)==i?'on':''}" style="background:${g}" title="${n}" role="button" tabindex="0" aria-label="Hintergrund ${n}" onclick="pickBn(${i})"></span>`).join('')}<label class="btn g" style="margin:0;font-size:15px">Eigenes Bild<input type="file" accept="image/*" hidden onchange="imgUp(this,'banner')"></label>${ME.bnu?`<button class="btn g" onclick="rmImg('banner')">Entfernen</button>`:''}</div></div><div class="card" style="padding:6px 24px">${SP.PF()}</div><h2>Meine Uploads</h2><div class="grid">${m.map(card).join('')||'<p class="m">Noch nichts hochgeladen.</p>'}</div>`},
person:()=>{const p=byId(P.u),me=p.id==ME.id,s=me?'':ql(p);return ptw(p,phead(p)+`<p class="m" style="text-align:center;margin-top:6px">${info(p,me)||'Noch keine Angaben.'}</p>${cre(p.id)}${bioH(p)}${me?`<p style="text-align:center"><button class="btn g" onclick="go('profil')">Mein Profil bearbeiten</button></p>`:`<p style="text-align:center">${s=='Befreundet'?`<button class="btn o" onclick="go('chat',{u:'${p.id}'})">Nachricht schreiben</button>`:s=='Anfrage offen'?`<button class="btn o" onclick="facc('${p.id}')">Anfrage annehmen</button>`:s=='Angefragt'?'<span class="m">Anfrage gesendet</span>':`<button class="btn o" onclick="rq('${p.id}')">Anfrage senden</button>`}</p>`}<p class="m" style="text-align:center">Code: ${fmt(p.code)}</p>`)},
