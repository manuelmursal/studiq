if(t=='book'&&!hasBooks())return bkLock();
if(!f.go)return `<h1>${T.n}</h1><p class="m">${T.s}. Wähle zuerst deine Klasse.</p><div class="card"><label>Klasse</label><div class="chips">${STU.map(s=>`<span class="chip ${f.stufe==s?'on':''}" onclick="fp('stufe',${s})">${s}</span>`).join('')}</div><p style="margin:22px 0 0"><button class="btn o" onclick="fgo()">Ergebnisse anzeigen</button></p></div>`;
return `<h1>${T.n}</h1><div class="bar">${t!='all'?`<span class="chip on" onclick="F['${t}'].go=0;render()">Klasse ${f.stufe}, ändern</span>`:''}<input placeholder="Suchen, zum Beispiel Deutsch" aria-label="Suche" value="${esc(f.q)}" oninput="F['${t}'].q=this.value;$('#gr').innerHTML=gr()">${t!='all'&&can(t)?`<button class="btn o" onclick="nw('${t}')">${T.one}</button>`:''}</div>${fch()}<div class="${t=='notes'?'':'grid'}" id="gr">${gr()}</div>`},
neu:()=>`<h1>${TY[cur.type].one}</h1><p class="m">Lege zuerst den Ordner an. Die Seiten lädst du im nächsten Schritt hoch.</p><div class="card"><label>Titel</label><input placeholder="Zum Beispiel Deutsch 7" oninput="u('title',this.value)" value="${esc(cur.title)}"><label>Fach</label>${sel('fach',FACH)}<label>Klasse</label>${sel('stufe',STU)}${nf()}<p style="margin:22px 0 0"><button class="btn o" onclick="mkd()">Weiter</button></p></div>`,
edit:()=>`<h1>${TY[cur.type].one} einrichten</h1><div class="ed"><div><div id="pv"></div><label>Cover (optional)</label><input type="file" accept="image/*" onchange="cov(this)"></div><div><label style="margin-top:0">Titel</label><input value="${esc(cur.title)}" oninput="u('title',this.value)">${cur.type=='book'?bcs():''}<label>Beschreibung (optional)</label><textarea rows="3" oninput="u('desc',this.value)">${esc(cur.desc)}</textarea><label>Farbe</label><div class="sw">${BCOL.map(c=>`<i class="${c==cur.color?'on':''}" style="background:${c}" onclick="u('color','${c}');this.parentNode.querySelectorAll('i').forEach(i=>i.classList.toggle('on',i==this))"></i>`).join('')}<input type="color" aria-label="Eigene Farbe" title="Eigene Farbe" value="${/^#[0-9a-f]{6}$/i.test(cur.color)?cur.color:'#f26b1d'}" style="width:30px;height:30px;padding:0;border:2px solid var(--bg);border-radius:50%;cursor:pointer;flex:none;background:none" oninput="u('color',this.value);this.parentNode.querySelectorAll('i').forEach(i=>i.classList.remove('on'))"></div><label>Fach</label>${sel('fach',FACH)}<label>Klasse</label>${sel('stufe',STU)}${nf()}<label>Schule (optional)</label><input value="${esc(cur.school)}" oninput="u('school',this.value)"></div></div><h2>Seiten hochladen</h2><p class="m" style="margin:-4px 0 12px">Jede Seite wird sofort dauerhaft gespeichert.</p><label class="drop">Bilder oder PDFs auswählen, auch GoodNotes-Exporte<input type="file" multiple hidden accept="image/*,application/pdf" onchange="up(this)"></label><div class="thumbs" id="th"></div><button class="btn o" onclick="fin()">Fertig</button> <button class="btn g" style="margin-left:10px" onclick="del()">Ordner löschen</button>`,
view:()=>VW.view0()+(cur.type!='book'?`<div id="soc">${socHTML()}</div>`:''),
view0:()=>`<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(cur.title)} ${bsc(DB.find(o=>String(o.id)==String(cur.id))||cur)}</h1>${cur.pages.length?`<button class="btn o" onclick="rdOpen()">Lesemodus</button><button class="btn g" onclick="dl(0)">Seite als PDF</button><button class="btn g" onclick="dl(1)">Alles als PDF</button>`:''}${stb(cur)}${pnb(DB.find(o=>String(o.id)==String(cur.id))||cur)}<button class="btn g" onclick="go('fwd',{id:'${cur.id}'})">Weiterleiten</button>${canEdit(cur)?`<button class="btn g" onclick="go('edit',{id:'${cur.id}'})">Bearbeiten</button>`:''}</div><p class="m">${cur.fach}, Klasse ${cur.stufe}${cur.desc?'. '+esc(cur.desc):''}</p>${cur.pages.length?`<div class="stage"><button class="ib" aria-label="Zurückblättern" onclick="show(-1)">${ic('back')}</button><div class="book" id="bk" style="cursor:zoom-in" onclick="rdOpen()"></div><button class="ib nx" aria-label="Weiterblättern" onclick="show(1)">${ic('back')}</button></div><div class="pn" id="pn"></div>`:`<div class="card"><p class="m" style="margin-top:0">Noch keine Seiten.</p>${canEdit(cur)?`<button class="btn o" onclick="go('edit',{id:'${cur.id}'})">Seiten hochladen</button>`:''}</div>`}`,
vokab:()=>{const mine=DK.filter(d=>d.owner==ME.id);return `<h1>Vokabeln</h1><p class="m">Erstelle Karteikarten-Stapel und übe sie. Am Ende jeder Runde siehst du deine Statistik. Stapel von anderen kannst du auch üben.</p><div class="card" style="max-width:none"><label style="margin-top:0">Neuer Stapel</label><div class="bar" style="margin:0"><input id="dn" maxlength="80" placeholder="Name, zum Beispiel Französisch Unit 3" onkeydown="event.key=='Enter'&&newDeck()"><button class="btn o" onclick="newDeck()">Anlegen</button></div></div><h2>Meine Stapel</h2><div class="grid">${mine.map(dcard).join('')||'<p class="m">Noch keine eigenen Stapel.</p>'}</div><h2>Stapel von anderen</h2><div class="bar" style="margin-top:0"><input placeholder="Suchen, zum Beispiel Latein" aria-label="Stapel suchen" value="${esc(DQ)}" oninput="DQ=this.value;$('#dg').innerHTML=dgr()"></div><div class="grid" id="dg">${dgr()}</div>`},
deck:()=>{
 const d=DK.find(x=>x.id==P.d),c=DKc[d.id],own=d.owner==ME.id||ME.role=='admin',rs=DKr[d.id]||[],rdy=c.filter(x=>x.front.trim()&&x.back.trim()).length;
 return `<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(d.title)}</h1><span class="chip ${REV?'on':''}" onclick="REV=!REV;render()">Rückseite zuerst</span><button class="btn o" onclick="startLearn('${d.id}')">Üben</button>${own?`<button class="btn g" onclick="delDeck('${d.id}')">Stapel löschen</button>`:''}</div><p class="m">${[d.fach,d.stufe&&'Klasse '+d.stufe,rdy+' Karten',d.owner!=ME.id&&'von '+dn(byId(d.owner))].filter(Boolean).map(esc).join(', ')}</p>${own?`<div class="card" style="max-width:none"><label style="margin-top:0">Titel</label><input maxlength="80" value="${esc(d.title)}" oninput="dset('title',this.value)"><label>Fach (optional)</label><select onchange="dset('fach',this.value||null)"><option value="">–</option>${FACH.map(f=>`<option ${f==d.fach?'selected':''}>${f}</option>`).join('')}</select><label>Klasse (optional)</label><select onchange="dset('stufe',this.value?+this.value:null)"><option value="">–</option>${STU.map(s=>`<option ${s==d.stufe?'selected':''}>${s}</option>`).join('')}</select><div class="row" style="margin-top:8px"><span>Andere dürfen diesen Stapel üben</span><input type="checkbox" ${d.shared?'checked':''} onchange="dset('shared',this.checked)"></div></div><h2>Karteikarten</h2><p class="m" style="margin:-4px 0 8px">Links steht die Vorderseite, rechts die Rückseite mit der Lösung. Alles wird automatisch gespeichert.</p><div id="cl">${c.map(crow).join('')}</div><div class="bar"><button class="btn g" onclick="addCard()">Karte hinzufügen</button><button class="btn g" onclick="$('#bulk').hidden=!$('#bulk').hidden">Aus Text einfügen</button></div><div class="card" id="bulk" hidden style="max-width:none"><p class="m" style="margin:0 0 8px">Eine Karte pro Zeile: Vorderseite ; Rückseite. Zum Beispiel: la maison ; das Haus</p><textarea id="bt" rows="6"></textarea><p style="margin:14px 0 0"><button class="btn o" onclick="bulkAdd()">Karten hinzufügen</button></p></div>`:`<div class="card" style="max-width:none"><p class="m" style="margin:0">Dieser Stapel gehört ${esc(dn(byId(d.owner)))}. Du kannst ihn üben, aber nicht ändern.</p></div>`}${rs.length?`<h2>Deine letzten Runden</h2><div class="card" style="padding:6px 24px;max-width:none">${rs.map(r=>`<div class="row"><span class="m">${fdt(r.created_at)}</span><span>${r.correct} von ${r.total} richtig</span><b>${r.total?Math.round(r.correct/r.total*100):0} %</b></div>`).join('')}</div>`:''}`
},
learn:()=>{
 const d=DK.find(x=>x.id==P.d),n=L.q.length;
 if(L.i>=n){
  const ok=L.ok.length,pct=Math.round(ok/n*100);
  return `<h1>Runde geschafft</h1><p class="m">${esc(d.title)}</p><div class="card" style="max-width:none;text-align:center"><div class="big">${ok} von ${n}</div><p class="m" style="margin:0">${pct} % richtig</p><div class="prog" style="margin:18px 0 0"><i style="width:${pct}%"></i></div></div><div class="stat"><div><b>${ok}</b><span>richtig</span></div><div><b>${L.bad.length}</b><span>falsch</span></div><div><b>${pct} %</b><span>Quote</span></div></div>${L.bad.length?`<h2>Das war noch falsch</h2><div class="card" style="padding:6px 24px;max-width:none">${L.bad.map(c=>`<div class="row"><span>${esc(c.front)}</span><span class="m">${esc(c.back)}</span></div>`).join('')}</div>`:'<p>Alles richtig. Stark!</p>'}<p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn o" onclick="startLearn('${d.id}')">Neue Runde</button>${L.bad.length?`<button class="btn g" onclick="startLearn('${d.id}',L.bad.map(c=>c.id))">Falsche nochmal</button>`:''}<button class="btn g" onclick="bk()">Zurück zum Stapel</button></p>`
 }
 const c=L.q[L.i],txt=L.flip!=L.rev?c.back:c.front,lab=L.flip!=L.rev?'Rückseite':'Vorderseite';
 return `<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(d.title)}</h1><span class="m">${L.i+1} von ${n}</span></div><div class="prog" style="margin:12px 0 18px"><i style="width:${L.i/n*100}%"></i></div><div class="fc ${L.flip?'bk2':''}" onclick="flipC()" role="button" tabindex="0" aria-label="Karte umdrehen"><div><small>${lab}</small>${esc(txt)}</div></div><p style="text-align:center;margin:20px 0 0">${L.flip?`<button class="btn g" onclick="ansC(0)">Falsch</button> <button class="btn o" onclick="ansC(1)">Richtig</button>`:`<button class="btn o" onclick="flipC()">Umdrehen</button>`}</p><p class="m" style="text-align:center;font-size:13px">Tastatur: Leertaste dreht um, Pfeil rechts heißt richtig, Pfeil links heißt falsch.</p>`
},
noten:()=>{
 const note=GM=='note',gl=GR.filter(g=>g.system==GM),vals=gl.map(g=>g.value),n=vals.length,a=mean(vals),
  best=n?(note?Math.min(...vals):Math.max(...vals)):0,worst=n?(note?Math.max(...vals):Math.min(...vals)):0;
 const m=new Map();gl.forEach(g=>{const k=g.fach.trim().toLowerCase();if(!m.has(k))m.set(k,{f:g.fach.trim(),v:[]});m.get(k).v.push(g.value)});
 const subs=[...m.values()].map(s=>({f:s.f,a:mean(s.v)})).sort((x,y)=>note?x.a-y.a:y.a-x.a);
 const keys=note?[1,2,3,4,5,6]:Array.from({length:16},(_,i)=>i),cnt=keys.map(k=>vals.filter(v=>note?Math.min(6,Math.max(1,Math.round(v)))==k:v==k).length),mx=Math.max(1,...cnt);
 const asc=gl.slice().reverse();
 return `<h1>Noten</h1><p class="m">Trag deine Noten oder MSS-Punkte ein und sieh dir die Statistik dazu an. Nur du siehst deine Einträge.</p><div class="card" style="max-width:none"><div class="seg" role="group" aria-label="Notensystem"><button class="${note?'on':''}" onclick="GM='note';render()">Noten (1 bis 6)</button><button class="${note?'':'on'}" onclick="GM='punkte';render()">MSS-Punkte (0 bis 15)</button></div><form class="gf" onsubmit="addGrade();return false"><div><label style="margin-top:0">Fach</label><input id="gf" list="fl" maxlength="40" placeholder="z. B. Mathe" required></div><div><label style="margin-top:0">Bezeichnung (optional)</label><input id="gt" maxlength="60" placeholder="z. B. Klassenarbeit 2"></div><div><label style="margin-top:0">${note?'Note':'Punkte'}</label><input id="gv" type="number" inputmode="decimal" step="${note?'0.1':'1'}" min="${note?1:0}" max="${note?6:15}" required></div><div><label style="margin-top:0">Datum</label><input id="gd" type="date" value="${todayStr()}"></div><button class="btn o" type="submit">Hinzufügen</button></form><datalist id="fl">${FACH.map(f=>`<option value="${f}">`).join('')}</datalist></div><h2>Einträge</h2><div class="card" style="padding:6px 16px;max-width:none">${n?`<table class="tbl"><thead><tr><th>Datum</th><th>Fach</th><th>${note?'Note':'Punkte'}</th><th></th></tr></thead><tbody>${gl.map(g=>`<tr><td>${fd(g.given_on)}</td><td>${esc(g.fach)}${g.title?`<br><span class="m" style="font-size:13px">${esc(g.title)}</span>`:''}</td><td><b>${fn(g.value)}</b></td><td style="text-align:right"><button class="ib" style="display:inline-flex" aria-label="Eintrag löschen" onclick="delGrade('${g.id}')">×</button></td></tr>`).join('')}</tbody></table>`:'<p class="m">Noch keine Einträge.</p>'}</div>${n?`<h2>Statistik</h2><div class="stat"><div><b>${fn(a)}</b><span>Durchschnitt${note?'':' (ca. Note '+fn(Math.max(1,(17-a)/3),1)+')'}</span></div><div><b>${fn(best)}</b><span>Bester Wert</span></div><div><b>${fn(worst)}</b><span>Schlechtester Wert</span></div><div><b>${n}</b><span>Einträge</span></div></div><div class="card" style="max-width:none"><b>Nach Fach</b>${subs.map(s=>`<div class="hbar"><span title="${esc(s.f)}">${esc(s.f)}</span><div class="prog"><i style="width:${Math.max(4,note?(6-s.a)/5*100:s.a/15*100)}%"></i></div><em>${fn(s.a)}</em></div>`).join('')}<p class="m" style="font-size:13px;margin:8px 0 0">Längerer Balken heißt besser.</p></div><div class="card" style="max-width:none"><b>${note?'Notenverteilung (gerundet)':'Verteilung der Punkte'}</b><div class="hist">${keys.map((k,i)=>`<div><span>${cnt[i]||''}</span><i style="height:${Math.round(cnt[i]/mx*90)}px"></i><em>${k}</em></div>`).join('')}</div></div><div class="card" style="max-width:none"><b>Verlauf</b>${n>1?`${gchart(asc)}<p class="m" style="font-size:13px;margin:8px 0 0">Die Linie ist dein Durchschnitt über die Zeit, die Kreise sind einzelne Werte. Oben ist besser.</p>`:'<p class="m">Ab zwei Einträgen siehst du hier den Verlauf.</p>'}</div>`:''}`
},
gruppen:()=>{const my=GRP.filter(gmine),pub=GRP.filter(g=>g.is_public&&!gmine(g)),row=(g,b)=>`<div class="row"><span style="display:flex;gap:12px;align-items:center;min-width:0">${gav(g)}<span style="min-width:0">${esc(g.name)}<span class="m">${g.is_public?'':' · privat'}, ${gcnt(g)} Mitglieder</span>${g.descr?`<br><span class="m" style="font-size:13px">${esc(g.descr.slice(0,80))}</span>`:''}</span></span>${b}</div>`;
return `<h1>Gruppen</h1><p class="m">Öffentliche Gruppen kann jeder betreten. Private Gruppen brauchen Name und Passwort.</p><div class="card" style="max-width:none"><label style="margin-top:0">Private Gruppe beitreten</label><div class="bar" style="margin:0"><input id="jn" placeholder="Gruppenname" autocapitalize="none"><input id="jp" type="password" placeholder="Passwort" autocomplete="off" onkeydown="event.key=='Enter'&&gJoin()"><button class="btn o" onclick="gJoin()">Beitreten</button></div></div><p><button class="btn g" onclick="go('gneu')">Neue Gruppe erstellen</button></p><h2>Meine Gruppen</h2><div class="card" style="padding:6px 24px;max-width:none">${my.map(g=>row(g,`<button class="btn o" onclick="go('gruppe',{g:'${g.id}'})">Öffnen</button>`)).join('')||'<p class="m">Du bist noch in keiner Gruppe.</p>'}</div><h2>Öffentliche Gruppen</h2><div class="card" style="padding:6px 24px;max-width:none">${pub.map(g=>row(g,`<button class="btn o" onclick="gJoin('${g.id}')">Beitreten</button>`)).join('')||'<p class="m">Noch keine öffentlichen Gruppen.</p>'}</div>`},
gneu:()=>{const pm=['admin','moderator'].includes(ME.role);return `<h1>Neue Gruppe</h1><div class="card"><label style="margin-top:0">Name</label><input id="gnm" maxlength="40" placeholder="3 bis 40 Zeichen"><label>Beschreibung (optional)</label><textarea id="gdesc" rows="3" maxlength="500"></textarea><label>Art</label><select id="gty" onchange="$('#gpw').parentNode.style.display=this.value=='pub'?'none':''">${pm?'<option value="pub">Öffentlich (jeder kann beitreten)</option>':''}<option value="priv">Privat (Name und Passwort)</option></select><div ${pm?'style="display:none"':''}><label>Passwort (mindestens 4 Zeichen)</label><input id="gpw" type="password" autocomplete="new-password"></div>${pm?'':'<p class="m" style="font-size:13px;margin-bottom:0">Öffentliche Gruppen können nur Moderatoren und Admins erstellen.</p>'}<p style="margin:22px 0 0"><button class="btn o" onclick="gMake()">Erstellen</button></p></div>`},
gruppe:()=>{const g=GRP.find(x=>x.id==P.g),mem=gmine(g);return `<div class="bar" style="margin:8px 0">${gav(g)}<div style="flex:1;min-width:0"><h1 style="margin:0;font-size:24px">${esc(g.name)}</h1><span class="m" style="font-size:13px">${g.is_public?'Öffentlich':'Privat'}, ${gcnt(g)} Mitglieder</span></div>${gown(g)?`<button class="btn g" onclick="go('gedit',{g:'${g.id}'})">Bearbeiten</button>`:''}${mem?`<button class="btn g" onclick="gLeave('${g.id}')">Verlassen</button>`:''}</div>${g.descr?`<p class="m" style="margin-top:0">${esc(g.descr)}</p>`:''}${mem?`<div class="card" id="ms"></div><div class="bar"><input id="mi" placeholder="Nachricht schreiben" maxlength="2000" onkeydown="event.key=='Enter'&&gSnd()"><button class="btn o" onclick="gSnd()">Senden</button></div>`:`<button class="btn o" onclick="gJoin('${g.id}')">Beitreten</button>`}`},
gedit:()=>{const g=GRP.find(x=>x.id==P.g);return `<h1>Gruppe bearbeiten</h1><div class="card"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${gav(g,72)}<label class="btn g" style="margin:0;font-size:15px">Gruppenbild<input type="file" accept="image/*" hidden onchange="gImg(this)"></label>${g.image_path?'<button class="btn g" onclick="gRmImg()">Entfernen</button>':''}</div><label>Name</label><input id="gnm" maxlength="40" value="${esc(g.name)}"><label>Beschreibung</label><textarea id="gdesc" rows="3" maxlength="500">${esc(g.descr)}</textarea>${g.is_public?'':'<label>Neues Passwort (leer lassen, wenn es gleich bleibt)</label><input id="gpw" type="password" autocomplete="new-password">'}<p style="margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap"><button class="btn o" onclick="gSave()">Speichern</button><button class="btn g" onclick="gDel('${g.id}')">Gruppe löschen</button></p></div>`},
fwd:()=>{const x=DB.find(i=>i.id==P.id),fr=frs().friends,my=GRP.filter(gmine),b=(k,id)=>`<button class="btn ${FW[k+id]?'g':'o'}" onclick="fwdTo('${k}','${id}')">${FW[k+id]?'Nochmal senden':'Senden'}</button>`;
return `<h1>Weiterleiten</h1><p class="m">${esc(x.title)}</p><h2>An Freunde</h2><div class="card" style="padding:6px 24px;max-width:none">${fr.map(id=>`<div class="row"><span>${pn(byId(id))}</span>${b('u',id)}</div>`).join('')||'<p class="m">Noch keine Freunde.</p>'}</div><h2>An Gruppen</h2><div class="card" style="padding:6px 24px;max-width:none">${my.map(g=>`<div class="row"><span style="display:flex;gap:12px;align-items:center">${gav(g,36)}${esc(g.name)}</span>${b('g',g.id)}</div>`).join('')||'<p class="m">Du bist in keiner Gruppe.</p>'}</div>`},
kart:()=>`<h1>Banana Boost</h1><div id="kmenu"><p class="m" style="margin-top:0">Wähle in der Garage dein Auto und deinen Fahrer mit den Pfeilen, drücke unten rechts auf Bereit und entscheide dann, ob du allein oder mit Freunden fährst. Am PC geht das auch mit den Pfeiltasten (← → Auto, ↑ ↓ Fahrer, Enter Bereit).</p><p class="m">Am PC: ↑ Gas, ↓ Bremse, ← → lenken, Leertaste, Shift oder E setzt dein Item ein. Gas und Bremse zusammen ergeben einen Burnout, und wer beim Countdown Gas hält, bekommt einen Raketenstart. Fahre durch die Item-Würfel: ⚡ Blitz bremst alle anderen, 🚀 Rakete jagt den Fahrer vor dir, 🍌 Banane legst du hinter dich auf die Straße, ⭐ Stern macht dich 5 Sekunden unverwundbar und schneller. Orange Pfeile auf der Straße geben dir einen kleinen Schub. Auf dem iPad: links lenken, rechts Gas, Bremse und Item.</p></div><div id="kgame" style="position:relative;margin-top:14px"><canvas id="kc" style="width:100%;height:min(76vh,720px);min-height:300px;border-radius:14px;touch-action:none;background:#222;display:block"></canvas><div id="kh" style="position:absolute;inset:0;pointer-events:none"></div><div id="kgar"><div class="kgt"><b id="kgn"></b><span id="kgs"></span></div><button class="kga l" onclick="kCar(-1)" aria-label="Voriges Auto">‹</button><button class="kga r" onclick="kCar(1)" aria-label="Nächstes Auto">›</button><div class="kgd"><button class="kga" onclick="kDrv(-1)" aria-label="Voriger Fahrer">‹</button><div><small>Fahrer</small><b id="kdn"></b></div><button class="kga" onclick="kDrv(1)" aria-label="Nächster Fahrer">›</button></div><div class="kgm" id="kgm"></div><button class="kgr" id="kgb" onclick="kGarReady()">Bereit</button></div><div id="kback" style="position:absolute;right:10px;top:10px;display:none;gap:8px"><button class="btn g" id="kfs" onclick="kFS(!KT.fs)">Vollbild beenden</button><button class="btn g" onclick="kBack()">Menü</button></div><div id="kctl"><div><button class="kp" data-k="l" style="width:84px;height:84px;background:#334155" aria-label="Links">◀</button><button class="kp" data-k="r" style="width:84px;height:84px;background:#334155" aria-label="Rechts">▶</button></div><div><button class="kp" data-k="u" style="width:84px;height:84px;background:#f26b1d;border-radius:50%;font-size:34px" aria-label="Boost">⚡</button><button class="kp" data-k="b" style="width:84px;height:100px;background:#d62828">Bremse</button><button class="kp" data-k="g" style="width:96px;height:150px;background:#2f9e44">Gas</button></div></div></div>`,
casino:()=>`<h1>Casino Round</h1><p class="m">Eine ruhige 3D-Casino-Halle, die du dir mit anderen teilst. Du läufst als Banane herum, siehst alle anderen mit Namen und Kontostand und spielst mit deinen Bookies. Hier gibt es nur eine einzige Lobby.</p><div id="cgame"><canvas id="cc"></canvas><div class="cz" id="cme"><b id="cmn"></b><span id="cmb">🍌 0</span><small id="con"></small></div><div class="cz" id="cbtn"><button class="btn g" id="cmu" onclick="czMute()" aria-label="Musik an oder aus">🔊</button><button class="btn g" onclick="czFS()">Vollbild</button><button class="btn g" onclick="go('spiele')">Verlassen</button></div><div class="cz" id="cfeed"></div><button class="btn o cz" id="cprompt" onclick="czAct()"></button><div class="cz" id="cemo">${CZ_EM.map(e=>`<button onclick="czEmote(${e[1]})" aria-label="Emote">${e[0]}</button>`).join('')}</div><div id="cft"><div class="czl"></div><div class="czr"></div><div class="cjs"><i></i></div></div><div class="cz" id="cintro"><div class="czp" style="text-align:center"><h2 style="font-size:30px">🍌 Casino Round</h2><p>Hier sehen dich alle, die gerade im Casino sind, mit Namen und Kontostand über dem Kopf. Gespielt wird mit deinen Bookies.</p><p>Gewinne die <b style="color:#ffd43b">goldene Banane</b>, ein seltener Preis, der neben deinem Namen glänzt.</p><p style="margin:16px 0 0"><button class="btn o" style="font-size:18px;padding:12px 30px" onclick="czEnter()">Eintreten</button></p><p class="m" style="font-size:12px">Mit Musik. Du kannst sie oben rechts ausschalten.</p></div></div><div class="cz" id="cpanel"></div></div><p class="m">Laufen mit W A S D oder den Pfeiltasten (hoch und runter), Umschauen mit der Maus (ziehen) oder den Pfeiltasten links und rechts, Shift rennt. Mit E oder dem Knopf unten spielst du an einem Tisch. Tasten 1 bis 6 sind Emotes. Auf dem iPad: Joystick links, rechts wischen zum Umschauen.</p>`,
bmem:()=>`<h1>Bananen-Memory</h1><p class="m">Ein schnelles Spiel für zwischendurch: Alle spielen dasselbe Memory-Brett, und wer am schnellsten alle 8 Paare findet, bekommt die meisten Punkte (3, 2, 1). Drei Runden dauern etwa drei Minuten. Allein kannst du üben, mit Freunden wird es ein Rennen.</p><div id="bm"></div>`,
kbest:()=>{const t=P.t||0,rows=KB.filter(r=>r.track==t).sort((a,b)=>a.ms-b.ms).slice(0,20);
return `<h1>Bestenliste</h1><p class="m">Die schnellste Zeit jedes Spielers für 3 Runden.</p><div class="bar" style="margin-top:0">${KTR.map((x,i)=>`<button class="btn ${i==t?'o':'g'}" onclick="go('kbest',{t:${i}},1)">${x.n}</button>`).join('')}</div><div class="card" style="padding:6px 24px;max-width:none">${rows.length?rows.map((r,i)=>`<div class="row"><span><b>${i+1}.</b> ${r.user_id==ME.id?'<b>Du</b>':esc(nm(r.user_id))}<span class="m" style="font-size:13px"> · ${KCAR[r.car]?KCAR[r.car].n:''}</span></span><b>${kFmt(r.ms)}</b></div>`).join(''):'<p class="m">Noch keine Zeiten. Fahr das erste Rennen!</p>'}</div>`},
arcade:()=>`<h1>Arcade Hall</h1><p class="m">Eine 3D-Spielhalle im Retro-Stil, die für alle offen ist. Du siehst jeden, der gerade da ist, und spielst an den Automaten Pac-Banana, Snake, Ziegel-Ausbruch oder Flappy Banane. Deinen Rekord speichert dein Gerät.</p><div id="cgame"><canvas id="cc"></canvas><div class="cz" id="cme"><b id="cmn"></b><span id="cmb">🍌 0</span><small id="con"></small></div><div class="cz" id="cbtn"><button class="btn g" id="cmu" onclick="arMute()" aria-label="Musik an oder aus">🔊</button><button class="btn g" onclick="czFS()">Vollbild</button><button class="btn g" onclick="go('spiele')">Verlassen</button></div><div class="cz" id="cfeed"></div><button class="btn o cz" id="cprompt" onclick="arAct()"></button><div class="cz" id="cemo">${CZ_EM.map(e=>`<button onclick="arEmote(${e[1]})" aria-label="Emote">${e[0]}</button>`).join('')}</div><div id="cft"><div class="czl"></div><div class="czr"></div><div class="cjs"><i></i></div></div><div class="cz ari" id="cintro"><canvas id="aris"></canvas><div class="arit"><div class="arlogo">ARCADE<br>HALL</div><p class="arins">★ INSERT COIN ★</p><button class="arbtn" onclick="arEnter()">PRESS START</button><p class="arsm">1UP 000000 &nbsp;&nbsp; HI-SCORE 099999</p><p class="arsm" style="margin-top:8px">MIT MUSIK · ALLE SPIELER SIND IN DERSELBEN HALLE</p></div><div class="arscan"></div></div><div class="cz arp" id="cpanel" style="display:none"></div></div><p class="m">Laufen mit W A S D oder den Pfeiltasten (hoch und runter), Umschauen mit der Maus (ziehen) oder den Pfeiltasten links und rechts, Shift rennt. Stell dich vor einen Automaten und drück E oder den Knopf unten, dann zoomt die Kamera hinein. Tasten 1 bis 6 sind Emotes. Auf dem iPad: Joystick links, rechts wischen zum Umschauen.</p>`,
spiele:()=>`<h1>Spiele</h1><p class="m">Eine kleine Pause zwischendurch.</p><div class="tiles" style="margin-top:20px">${tl([['game','Tic Tac Toe','Gegen den Computer, zu zweit oder online','ttt'],['game','Banana Boost','Gegen den Computer oder online mit Freunden','kart'],['chess','Schach','Gegen den Computer, zu zweit oder online','chess'],['book','Bookie Clicker','Klicke Bücher und baue deine Bibliothek aus','clicker'],['game','Bookie Slots','Dreh die Maschine und vermehre deine Bookies','slots'],['game','Banana Fight','Online-Shooter als Banane, mit Bots oder Freunden','bf'],['game','Casino Round','Ruhiges 3D-Casino mit Roulette, Würfeln, Slots und einer goldenen Banane','casino'],['game','Bananen-Memory','Schnelles Memory-Rennen mit Freunden, ein paar Minuten Spaß','bmem'],['game','Arcade','Retro-Halle mit Automaten, offen für alle','arcade']])}</div>`,
chess:()=>{
 if(CH.gid!='l'){CH.gid='l';CH.sel=-1;CH.pm=null}
 const C=chLocal(),cpu=C.mode=='cpu',R=chRep(C.hist.join(' ')),st=chStat(R.s,R.keys),think=cpu&&!st&&R.s.t!=C.me,sg=(a,v,f)=>`<div class="seg" role="group">${a.map(([k,l])=>`<button class="${v==k?'on':''}" onclick="${f}('${k}')">${l}</button>`).join('')}</div>`,
 msg=st?(st.res=='draw'?'Remis ('+st.why+').':cpu?(st.res==C.me?'Du hast gewonnen!':'Der Computer hat gewonnen.'):(st.res=='w'?'Weiß':'Schwarz')+' hat gewonnen ('+st.why+').'):think?'Der Computer denkt …':(cpu?'Du bist dran':(R.s.t=='w'?'Weiß':'Schwarz')+' ist dran')+(chChk(R.s)?' – Schach!':'.');
 if(st&&cpu&&st.res==C.me&&!C.paid){C.paid=1;setTimeout(()=>bkEarn('chess',C.lvl=='easy'?3:C.lvl=='mid'?8:15,null,'Sieg gegen den Computer'),0)}
 return `<div class="chv"><h1>Schach</h1><div class="bar chx" style="margin-top:0"><div class="seg" role="group" aria-label="Modus"><button class="${cpu?'on':''}" onclick="chMode('cpu')">Gegen Computer</button><button class="${cpu?'':'on'}" onclick="chMode('two')">Zu zweit</button><button onclick="go('chessf')">Mit Freunden</button></div>${cpu?sg([['easy','Leicht'],['mid','Mittel'],['hard','Schwer']],C.lvl,'chLvl')+sg([['w','Weiß'],['b','Schwarz']],C.me,'chSide'):''}</div><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p>${chBoard(R,cpu&&C.me=='b',!!st||think)}<p class="chx" style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn g" onclick="chFS()">Vollbild</button><button class="btn g" onclick="chUndo()" ${R.n&&!think?'':'disabled'}>Zug zurück</button><button class="btn o" onclick="chNewG()">Neue Partie</button></p></div><button class="btn g chfb" onclick="chFS()">Vollbild beenden</button>`},
chessf:()=>{
 const fr=frs().friends,g=CGAMES,act=g.filter(x=>!x.result),fin=g.filter(x=>x.result),opp=x=>x.w==ME.id?x.b:x.w,my=x=>x.w==ME.id?'w':'b';
 const w=fin.filter(x=>x.result==my(x)).length,l=fin.filter(x=>x.result!='draw'&&x.result!=my(x)).length,d=fin.length-w-l;
 const row=x=>{const o=opp(x),r=x.result,st=r?(r=='draw'?'Remis':r==my(x)?'Gewonnen':'Verloren'):(x.turn==my(x)?'<b style="color:var(--acc)">Du bist dran</b>':'Wartet auf '+esc(nm(o)));return `<div class="row"><span>${pn(byId(o))}<br><span class="m" style="font-size:13px">${st}, du spielst ${my(x)=='w'?'Weiß':'Schwarz'}</span></span><span style="display:flex;gap:8px;align-items:center"><button class="btn ${r||x.turn!=my(x)?'g':'o'}" onclick="go('chessg',{g:'${x.id}'})">Öffnen</button><button class="ib" aria-label="Partie löschen" onclick="cDel('${x.id}')">×</button></span></div>`};
 return `<h1>Schach mit Freunden</h1><p class="m">Jeder spielt an seinem eigenen Gerät. Die Farben werden zufällig verteilt.</p><h2>Freund herausfordern</h2><div class="card" style="padding:6px 24px;max-width:none">${fr.length?fr.map(id=>`<div class="row"><span>${pn(byId(id))}</span><button class="btn o" onclick="cNew('${id}')">${act.some(x=>opp(x)==id)?'Partie öffnen':'Herausfordern'}</button></div>`).join(''):`<p class="m">Du hast noch keine Freunde.</p><p><button class="btn g" onclick="go('freunde')">Freunde hinzufügen</button></p>`}</div>${act.length?`<h2>Laufende Partien</h2><div class="card" style="padding:6px 24px;max-width:none">${act.map(row).join('')}</div>`:''}${fin.length?`<h2>Beendet</h2><div class="stat"><div><b>${w}</b><span>Siege</span></div><div><b>${d}</b><span>Remis</span></div><div><b>${l}</b><span>Niederlagen</span></div></div><div class="card" style="padding:6px 24px;max-width:none">${fin.slice(0,10).map(row).join('')}</div>`:''}`},
chessg:()=>{
 const g=CGAMES.find(x=>x.id==P.g);
 if(CH.gid!=g.id){CH.gid=g.id;CH.sel=-1;CH.pm=null}
 const me=g.w==ME.id?'w':'b',ot=me=='w'?'b':'w',o=me=='w'?g.b:g.w,R=chRep(g.hist),over=!!g.result,mine=!over&&g.turn==me,why=g.reason?' ('+esc(g.reason)+')':'',
 msg=over?(g.result=='draw'?'Remis'+why+'.':g.result==me?'Du hast gewonnen'+why+'!':esc(nm(o))+' hat gewonnen'+why+'.'):mine?'Du bist dran'+(chChk(R.s)?' – Schach!':'.'):esc(nm(o))+' ist dran …';
 bkChess(g,me);return `<div class="chv"><h1>Schach</h1><p class="m" style="margin-bottom:0">Du (${me=='w'?'Weiß':'Schwarz'}) gegen <b style="font-weight:500">${esc(nm(o))}</b> (${me=='w'?'Schwarz':'Weiß'})</p><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p>${!over&&g.draw_offer==ot?`<div class="card" style="max-width:520px;margin:0 auto 14px;text-align:center;padding:14px"><p style="margin:0 0 10px">${esc(nm(o))} bietet Remis an.</p><button class="btn o" onclick="cAct('accept')">Annehmen</button> <button class="btn g" onclick="cAct('decline')">Ablehnen</button></div>`:''}${chBoard(R,me=='b',!mine)}<p class="chx" style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn g" onclick="chFS()">Vollbild</button>${over?`<button class="btn o" onclick="cNew('${o}')">Neue Partie</button><button class="btn g" onclick="cDel('${g.id}')">Partie löschen</button>`:`${g.draw_offer==me?'<span class="m" style="align-self:center">Remis angeboten …</span>':`<button class="btn g" onclick="cAct('offer')">Remis anbieten</button>`}<button class="btn g" onclick="cAct('resign')">Aufgeben</button>`}</p></div><button class="btn g chfb" onclick="chFS()">Vollbild beenden</button>`},
shop:()=>{
 const w=WL[ME.id],bal=w?+w.balance:0,co=COS[ME.id]||{frame:'none',board:'classic',ptheme:'none',stheme:'studiq',title:'none'},
 fl=[{id:'none',kind:'frame',name:'Kein Rahmen',price:0},...SHI.filter(i=>i.kind=='frame')],bd=[{id:'classic',kind:'board',name:'Klassisch Orange',price:0},...SHI.filter(i=>i.kind=='board')],pl=[{id:'none',kind:'ptheme',name:'Kein Theme',price:0},...SHI.filter(i=>i.kind=='ptheme')],sl=[{id:'studiq',kind:'stheme',name:'STUDIQ Orange',price:0},...SHI.filter(i=>i.kind=='stheme')],ti=[{id:'none',kind:'title',name:'Kein Titel',price:0},...SHI.filter(i=>i.kind=='title')],
 card=i=>{const have=i.price==0||OWN.has(i.id),on=co[i.kind]==i.id,
  prev=i.kind=='title'?`<div class="ttl" style="margin:14px 0">${i.id=='none'?'–':esc(i.name)}</div>`:i.kind=='frame'?`<div class="frm ${i.id=='none'?'':i.id}"><img src="${avOf(ME)}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;display:block"></div>`:i.kind=='ptheme'?`<div class="pt ${i.id=='none'?'':i.id}" style="height:64px;width:100%;padding:0;border-radius:14px;${i.id=='none'?'background:var(--line)':''}"></div>`:i.kind=='stheme'?`<div style="width:64px;height:64px;border-radius:50%;background:${STH[i.id]?STH[i.id].a:'#f26b1d'};box-shadow:0 0 0 4px ${STH[i.id]?STH[i.id].l:'#fafaf8'},0 0 0 5px var(--line)"></div>`:`<div class="chb mini ${i.id}">${Array.from({length:16},(_,k)=>`<span class="chs ${((k>>2)+k)%2?'d':'l'}"></span>`).join('')}</div>`;
  return `<div class="sic">${prev}<b style="font-weight:500">${esc(i.name)}</b>${have?'<span class="m" style="font-size:13px">'+(i.price?'Gekauft':'Gratis')+'</span>':`<span class="bkp">${bki(16)} ${bkn(i.price)}</span>`}<button class="btn ${on?'g':have||bal>=i.price?'o':'g'}" ${on?'disabled':''} onclick="${have?`bkEquip('${i.kind}','${i.id}')`:`bkBuy('${i.id}')`}">${on?'Aktiv':have?'Anziehen':'Kaufen'}</button></div>`};
 return `<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">Item-Shop</h1><button class="ib" aria-label="So verdienst du Bookies" aria-expanded="${BKINFO}" onclick="BKINFO=!BKINFO;render()"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button></div><p style="display:flex;gap:8px;align-items:center;margin:8px 0 0">${bki(26)}<b style="font:500 24px Fraunces,Georgia,serif">${bkn(bal)}</b> Bookies</p>${BKINFO?`<div class="card" style="max-width:none;margin-top:16px"><h2 style="margin:0 0 8px;font-size:18px">So verdienst du Bookies</h2><ol style="margin:0;padding-left:20px;line-height:1.7"><li><b style="font-weight:500">Tic Tac Toe:</b> Sieg gegen den Computer 3 Bookies (Leicht) oder 6 (Schwer). Online mit Freunden gibt es 8 für einen Sieg und 3 für ein Unentschieden.</li><li><b style="font-weight:500">Schach:</b> Sieg gegen den Computer 3 (Leicht), 8 (Mittel) oder 15 (Schwer). Online mit Freunden gibt es 12 für einen Sieg und 4 für Remis.</li><li><b style="font-weight:500">Kart-Rennen:</b> 12 Bookies für Platz 1, 8 für Platz 2, 5 für Platz 3, sonst 3. Eine neue Bestzeit bringt 10 extra.</li><li><b style="font-weight:500">Bookie Clicker:</b> Klicke Bücher und baue deine Bibliothek aus. Ab 100 Büchern insgesamt bekommst du Bookies, je mehr Bücher, desto mehr. Ab 100 Mio. Büchern wird jedes weitere Level deutlich teurer.</li><li>Zu zweit am selben Gerät gibt es keine Bookies.</li></ol><p class="m" style="margin:12px 0 0;font-size:13px">Damit niemand es übertreibt, gibt es höchstens 200 Bookies pro Stunde und 800 pro Tag aus Spielen. Aus dem Clicker gibt es keine Obergrenze. Eine Partie bringt nur einmal Bookies.</p></div>`:''}${SHI.length?`<h2>Profil-Rahmen</h2><p class="m" style="margin:-4px 0 12px">Der Rahmen erscheint um dein Profilbild, für alle sichtbar.</p><div class="sgrid">${fl.map(card).join('')}</div><h2>Schachbretter</h2><p class="m" style="margin:-4px 0 12px">Das Brett siehst nur du in deinen Schachpartien.</p><div class="sgrid">${bd.map(card).join('')}</div><h2>Profil-Themes</h2>${SHI.some(i=>i.kind=='ptheme')?'':'<p class="m" style="color:var(--acc)">Die neuen Themes sind noch nicht eingerichtet. Bitte führe update11.sql in Supabase aus.</p>'}<p class="m" style="margin:-4px 0 12px">Das Theme erscheint auf deinem Profil, für alle sichtbar.</p><div class="sgrid">${pl.map(card).join('')}</div><h2>STUDIQ-Themes</h2><p class="m" style="margin:-4px 0 12px">Färbt die ganze Seite bei dir ein, mit Akzentfarbe und Hintergrund.</p><div class="sgrid">${sl.map(card).join('')}</div><h2>Titel</h2><p class="m" style="margin:-4px 0 12px">Dein Titel steht im Profil unter deinem Namen.</p>${SHI.some(i=>i.kind=='title')?'':'<p class="m" style="color:var(--acc)">Die Titel sind noch nicht eingerichtet. Bitte führe update14.sql in Supabase aus.</p>'}<div class="sgrid">${ti.map(card).join('')}</div>`:`<div class="card" style="max-width:none;margin-top:16px"><p class="m" style="margin:0">Der Shop ist noch nicht eingerichtet. Bitte führe update10.sql in Supabase aus.</p></div>`}`},
bf:()=>`<h1>Banana Fight</h1><p class="m">Du bist eine Banane mit Waffen. Gegen Bots oder online mit Freunden. Wer zuerst 15 Treffer schafft, gewinnt. Vor jeder Runde stimmst du über die Map ab.</p><div id="bfgame" style="position:relative;margin-top:14px"><canvas id="bfc" style="width:100%;height:min(78vh,760px);min-height:320px;display:block;border-radius:14px;background:#1c1c1e;cursor:crosshair"></canvas><div id="bfh"></div><button class="btn g bffb" style="position:absolute;right:12px;top:12px;z-index:6;pointer-events:auto" onclick="bfFS()">Vollbild</button></div><p class="m">WASD laufen, Maus zielen, Klick schießen, Leertaste springen, Shift rennen, R nachladen, 1 bis 4 oder Mausrad für die Waffe, rechte Maustaste halten zum Zielen, B für Emotes (auf dem iPad der Knopf oben links), Tab für die Rangliste, Esc für das Pausenmenü. Am Computer mit Maus und Tastatur. Auf dem iPad: Joystick links zum Laufen (weit ziehen = rennen), rechts wischen zum Umschauen, Knöpfe rechts unten zum Schießen, Springen, Zielen, Nachladen und Waffenwechsel. Tipp: Tippe auf „Vollbild“.</p>`,
slots:()=>`<h1>Bookie Slots</h1><p class="m">Setze Bookies und zieh am Hebel. Drei gleiche Symbole bringen richtig viel.</p><div class="slo"><div class="slm" id="slm" onpointerdown="slSpark(event)"><div class="slt">BOOKIE SLOTS</div><div class="sbl">${'<i></i>'.repeat(13)}</div><div class="sw">${[0,1,2].map(slReel).join('')}<div class="sp"></div></div><p class="sms" id="slmsg" role="status">Viel Glück!</p><div class="lcd"><div><span>Guthaben</span><b>${bki(18)} <span id="slb" style="font-size:22px;letter-spacing:0;text-transform:none;color:inherit">0</span></b></div><div><span>Gewinn</span><b id="slw">0</b></div></div><div class="sctl"><button class="sbtn" onclick="slBet(-1)" aria-label="Einsatz senken">−</button><div class="sbet"><span>Einsatz</span><b id="slbet">25</b></div><button class="sbtn" onclick="slBet(1)" aria-label="Einsatz erhöhen">+</button><button class="sbtn" onclick="slBet(9)">Max</button></div><button class="sbtn sgo" id="slgo" onclick="slSpin()">DREHEN</button></div><div class="lv" id="lv" onclick="slSpin()" role="button" aria-label="Hebel ziehen"><i class="lb"></i><i class="lr"></i><i class="lz"></i></div></div><details class="card" style="max-width:440px;margin:6px auto 0;padding:14px 20px"><summary style="cursor:pointer">Gewinntabelle</summary><div style="margin-top:10px">${SLS.map((s,i)=>`<div class="row" style="padding:3px 0;border:0"><span>${s}${s}${s}</span><b style="font-weight:500">x${SLP[i]}</b></div>`).join('')}<p class="m" style="font-size:13px">Zwei gleiche Symbole von links: x1,5. Nur eine Kirsche links: Einsatz zurück. Der Zufall wird auf dem Server gezogen.</p></div></details>`,
clicker:()=>{
 const rate=ckMul('a'),bu=CKU.filter(u=>!CK.u.includes(u[0])),done=CKU.filter(u=>CK.u.includes(u[0]));
 return `<h1>Bookie Clicker</h1><p class="m">Klicke aufs Buch, kaufe Helfer und lass die Bücher irgendwann von selbst entstehen. Aus deinen Büchern werden Bookies.</p><div class="card" style="max-width:none;text-align:center"><div style="font:500 36px/1.1 Fraunces,Georgia,serif"><span id="ckb">0</span> <span style="font-size:20px">Bücher</span></div><p class="m" style="margin:4px 0 14px"><span id="ckr">0</span> pro Sekunde, <span id="ckp">1</span> pro Klick</p><div id="ckf" style="position:relative;display:flex;justify-content:center"><button class="ckbook" onclick="ckClick(event)" aria-label="Buch anklicken"><svg viewBox="0 0 24 24" width="96" height="96" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${IC.book}</svg></button></div><p class="m" id="ckbk" style="margin:14px 0 0;font-size:14px"></p></div><h2>Helfer</h2><div class="card" style="padding:6px 24px;max-width:none">${CKB.map((b,i)=>`<div class="row"><span><b style="font-weight:500">${b[0]}</b> <span class="m">(${CK.n[i]})</span><br><span class="m" style="font-size:13px">${b[1]}, ${ckR(b[3]*rate)} Bücher pro Sekunde</span></span><button class="btn o" data-ck="${ckCost(i)}" onclick="ckBuy(${i})">${ckFmt(ckCost(i))}</button></div>`).join('')}</div><h2>Verbesserungen</h2><div class="card" style="padding:6px 24px;max-width:none"><div class="row"><span><b style="font-weight:500">Besserer Stift</b> <span class="m">(${CK.cl})</span><br><span class="m" style="font-size:13px">+1 Buch pro Klick</span></span><button class="btn o" data-ck="${ckClc()}" onclick="ckPen()">${ckFmt(ckClc())}</button></div>${bu.map(u=>`<div class="row"><span><b style="font-weight:500">${u[1]}</b><br><span class="m" style="font-size:13px">${u[2]}</span></span><button class="btn o" data-ck="${u[3]}" onclick="ckUp('${u[0]}')">${ckFmt(u[3])}</button></div>`).join('')}${done.map(u=>`<div class="row"><span><b style="font-weight:500">${u[1]}</b><br><span class="m" style="font-size:13px">${u[2]}</span></span><span class="m">Gekauft</span></div>`).join('')}</div><p class="m" style="font-size:13px">Dein Stand wird automatisch gespeichert. Auch wenn du weg bist, arbeiten deine Helfer bis zu 4 Stunden weiter.</p>`},
ttt:()=>{
 if(!TT)ttNew();
 const t=TT,cpu=t.mode=='cpu',nm={X:cpu?'Du':'Spieler X',O:cpu?'Computer':'Spieler O'};
 const msg=t.over?(t.res.w=='D'?'Unentschieden.':cpu?(t.res.w=='X'?'Du hast gewonnen!':'Der Computer hat gewonnen.'):'Spieler '+t.res.w+' hat gewonnen!'):(cpu?(t.turn=='O'?'Der Computer denkt …':'Du bist dran (X).'):'Spieler '+t.turn+' ist dran.');
 const cells=t.b.map((v,i)=>`<button class="ttc ${v?'f '+v.toLowerCase():''} ${t.over&&t.res.l.includes(i)?'w':''}" aria-label="Feld ${i+1}, ${v||'leer'}" onclick="ttPlay(${i})" ${v||t.over?'disabled':''}>${v}</button>`).join('');
 return `<h1>Tic Tac Toe</h1><div class="bar" style="margin-top:0"><div class="seg" role="group" aria-label="Modus"><button class="${cpu?'on':''}" onclick="ttMode('cpu')">Gegen Computer</button><button class="${cpu?'':'on'}" onclick="ttMode('two')">Zu zweit</button><button onclick="go('tttf')">Mit Freunden</button></div>${cpu?`<div class="seg" role="group" aria-label="Stufe"><button class="${t.lvl=='easy'?'on':''}" onclick="ttLvl('easy')">Leicht</button><button class="${t.lvl=='hard'?'on':''}" onclick="ttLvl('hard')">Schwer</button></div>`:''}</div><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p><div class="ttb">${cells}</div><div class="stat" style="max-width:420px;margin:20px auto"><div><b>${t.sc.X}</b><span>${nm.X}</span></div><div><b>${t.sc.D}</b><span>Unentschieden</span></div><div><b>${t.sc.O}</b><span>${nm.O}</span></div></div><p style="text-align:center"><button class="btn o" onclick="ttNext()">Neue Runde</button></p>`
},
tttf:()=>{
 const fr=frs().friends,g=GAMES,act=g.filter(x=>!x.result),fin=g.filter(x=>x.result),opp=x=>x.x==ME.id?x.o:x.x,my=x=>x.x==ME.id?'X':'O';
 const w=fin.filter(x=>x.result==my(x)).length,l=fin.filter(x=>x.result!='draw'&&x.result!=my(x)).length,d=fin.length-w-l;
 const row=x=>{const o=opp(x),r=x.result,st=r?(r=='draw'?'Unentschieden':r==my(x)?'Gewonnen':'Verloren'):(x.turn==my(x)?'<b style="color:var(--acc)">Du bist dran</b>':'Wartet auf '+esc(nm(o)));return `<div class="row"><span>${pn(byId(o))}<br><span class="m" style="font-size:13px">${st}</span></span><span style="display:flex;gap:8px;align-items:center"><button class="btn ${r||x.turn!=my(x)?'g':'o'}" onclick="go('tttg',{g:'${x.id}'})">Öffnen</button><button class="ib" aria-label="Spiel löschen" onclick="tDel('${x.id}')">×</button></span></div>`};
 return `<h1>Tic Tac Toe mit Freunden</h1><p class="m">Jeder spielt an seinem eigenen Gerät. Wer dran ist, siehst du sofort.</p><h2>Freund herausfordern</h2><div class="card" style="padding:6px 24px;max-width:none">${fr.length?fr.map(id=>`<div class="row"><span>${pn(byId(id))}</span><button class="btn o" onclick="tNew('${id}')">${act.some(x=>opp(x)==id)?'Spiel öffnen':'Herausfordern'}</button></div>`).join(''):`<p class="m">Du hast noch keine Freunde.</p><p><button class="btn g" onclick="go('freunde')">Freunde hinzufügen</button></p>`}</div>${act.length?`<h2>Laufende Spiele</h2><div class="card" style="padding:6px 24px;max-width:none">${act.map(row).join('')}</div>`:''}${fin.length?`<h2>Beendet</h2><div class="stat"><div><b>${w}</b><span>Siege</span></div><div><b>${d}</b><span>Unentschieden</span></div><div><b>${l}</b><span>Niederlagen</span></div></div><div class="card" style="padding:6px 24px;max-width:none">${fin.slice(0,10).map(row).join('')}</div>`:''}`
},
tttg:()=>{
 const g=GAMES.find(x=>x.id==P.g),me=g.x==ME.id?'X':'O',o=g.x==ME.id?g.o:g.x,b=g.board.split('').map(c=>c=='-'?'':c),r=g.result?tWin(b):null,wl=r&&r.w!='D'?r.l:[],mine=!g.result&&g.turn==me;
 const msg=g.result?(g.result=='draw'?'Unentschieden.':g.result==me?'Du hast gewonnen!':esc(nm(o))+' hat gewonnen.'):(mine?'Du bist dran ('+me+').':esc(nm(o))+' ist dran …');
 const cells=b.map((v,i)=>`<button class="ttc ${v?'f '+v.toLowerCase():''} ${wl.includes(i)?'w':''}" aria-label="Feld ${i+1}, ${v||'leer'}" onclick="tMove(${i})" ${v||!mine?'disabled':''}>${v}</button>`).join('');
 bkTtt(g,me);return `<h1>Tic Tac Toe</h1><p class="m" style="margin-bottom:0">Du (${me}) gegen <b style="font-weight:500">${esc(nm(o))}</b> (${me=='X'?'O':'X'})</p><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p><div class="ttb">${cells}</div><p style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${g.result?`<button class="btn o" onclick="tNew('${o}')">Nochmal spielen</button>`:''}<button class="btn g" onclick="tDel('${g.id}')">${g.result?'Spiel löschen':'Aufgeben und löschen'}</button></p>`
},
notif:()=>{const f=frs(),ids=Object.keys(UNR),perm='Notification' in window?Notification.permission:'';return `<h1>Benachrichtigungen</h1>${f.inc.length?`<h2>Freundschaftsanfragen</h2><div class="card" style="padding:6px 24px;max-width:none">${f.inc.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p}'})">${pn(byId(p))}</span><button class="btn o" onclick="facc('${p}')">Annehmen</button></div>`).join('')}</div>`:''}${ME.role=='admin'&&REQS&&REQS.length?`<h2>Admin</h2><div class="card" style="padding:6px 24px;max-width:none"><div class="row"><span><b>${REQS.length}</b> Zugriffsanfrage${REQS.length>1?'n':''} für die Bücherbibliothek</span><button class="btn o" onclick="go('admin')">Öffnen</button></div></div>`:''}${AG.length?`<h2>Spiele</h2><div class="card" style="padding:6px 24px;max-width:none">${AG.map(g=>`<div class="row"><span>Tic Tac Toe: Du bist dran gegen <b>${esc(nm(g.x==ME.id?g.o:g.x))}</b></span><button class="btn o" onclick="go('tttg',{g:'${g.id}'})">Öffnen</button></div>`).join('')}</div>`:''}${ids.length?`<h2>Neue Nachrichten</h2><div class="card" style="padding:6px 24px;max-width:none">${ids.map(id=>{const m=NMSG.find(x=>x.sender==id);return `<div class="row"><span>${pn(byId(id))}<span class="m">, ${UNR[id]} neu</span><br><span class="m">${esc(String(m?(m.body||'Bild'):'').slice(0,60))}</span></span><button class="btn o" onclick="go('chat',{u:'${id}'})">Öffnen</button></div>`}).join('')}</div>`:''}${f.inc.length||ids.length||AG.length||(ME.role=='admin'&&REQS&&REQS.length)?'':'<p class="m">Nichts Neues.</p>'}${perm?`<div class="card" style="max-width:none"><b>Hinweise im Browser</b><p class="m" style="margin:6px 0 12px">${perm=='granted'?'Sie sind eingeschaltet. Du bekommst einen Hinweis, wenn die Seite im Hintergrund offen ist und etwas Neues kommt.':perm=='denied'?'Dein Browser blockiert sie gerade. Erlaube Hinweise für diese Seite in den Browser-Einstellungen.':'Bekomme einen Hinweis, wenn die Seite im Hintergrund offen ist und etwas Neues kommt. Bei geschlossener Seite gibt es keine Hinweise.'}</p>${perm=='default'?'<button class="btn o" onclick="askNotif()">Hinweise einschalten</button>':''}</div>`:''}`},
chat:()=>{const f=frs().friends;if(P.u&&f.includes(P.u)){const p=byId(P.u);return `<div class="bar" style="margin:8px 0"><h1 style="flex:1;margin:0">${esc(dn(p))}</h1><button class="btn g" onclick="go('person',{u:'${p.id}'})">Profil</button></div><div class="card" id="ms"></div><div class="bar"><input id="mi" placeholder="Nachricht schreiben" maxlength="2000" onkeydown="event.key=='Enter'&&snd()"><label class="btn g" style="margin:0;display:flex;align-items:center" title="Bild senden" aria-label="Bild senden">${ic('image')}<input type="file" accept="image/*" hidden onchange="sndImg(this)"></label><button class="btn o" onclick="snd()">Senden</button></div>`}return `<h1>Chat</h1><p class="m">Du kannst Freunden schreiben. Freunde fügst du über Name oder Code hinzu.</p><div class="card" style="padding:6px 24px;max-width:none">${f.length?f.map(id=>`<div class="row"><span>${pn(byId(id))}</span><button class="btn o" onclick="go('chat',{u:'${id}'})">Schreiben</button></div>`).join(''):'<p class="m">Noch keine Freunde.</p>'}</div><p><button class="btn g" onclick="go('freunde')">Freunde hinzufügen</button></p>`},
set:()=>`<h1>Einstellungen</h1><div class="tabs">${['Konto','Darstellung','Privatsphäre'].map(t=>`<button class="tab ${t==st?'on':''}" onclick="st='${t}';render()">${t}</button>`).join('')}</div><div class="card" style="padding:6px 24px;margin-top:16px">${SP[st]()}</div>`};
const SP={
Konto:()=>`<div class="row"><span>Angemeldet als <b>${esc(ME.username)}</b> (${ROLEN[ME.role]})</span><button class="btn g" onclick="out()">Abmelden</button></div><div class="row"><span>Benutzername<br><span class="m" style="font-size:13px">3 bis 20 Zeichen. Damit meldest du dich an.</span></span><div style="display:flex;gap:8px;align-items:center"><input id="nu" maxlength="20" autocapitalize="none" value="${esc(ME.username)}" style="max-width:170px" onkeydown="event.key=='Enter'&&chName()"><button class="btn g" onclick="chName()">Ändern</button></div></div><div class="row"><span>Profil mit Schule, Klasse und Stufe</span><button class="btn g" onclick="go('profil')">Bearbeiten</button></div><div class="row"><input id="np" type="password" placeholder="Neues Passwort" autocomplete="new-password" style="max-width:220px"><button class="btn g" onclick="npw()">Passwort ändern</button></div><div class="row"><span>Was ist neu?</span><button class="btn g" onclick="showSplash(1)">Ansehen</button></div>`,
PF:()=>`<div class="row"><span>Anzeigename</span><input style="max-width:220px" placeholder="${esc(ME.username)}" value="${esc(ME.display_name||'')}" oninput="svp('display_name',this.value.trim()||null)"></div><div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><span>Über mich<br><span class="m" style="font-size:13px">Hobbys, Interessen und mehr (höchstens 300 Zeichen)</span></span><textarea rows="4" maxlength="300" oninput="svp('bio',this.value.trim()||null)">${esc(ME.bio||'')}</textarea></div><div class="row"><span>Benutzername</span><b>@${esc(ME.username)}</b></div><div class="row"><span>Schule</span><select style="max-width:220px" onchange="svp('school_id',this.value||null)"><option value="">–</option>${SCH.map(s=>`<option value="${s.id}" ${s.id==ME.school_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="row"><span>Klasse</span><input style="max-width:120px" placeholder="z. B. 7a" value="${esc(ME.klasse||'')}" oninput="svp('klasse',this.value)"></div><div class="row"><span>Stufe</span><select style="max-width:120px" onchange="svp('stufe',this.value?+this.value:null)"><option value="">–</option>${STU.map(v=>`<option ${v==ME.stufe?'selected':''}>${v}</option>`).join('')}</select></div>`,
Darstellung:()=>`<div class="row"><span>Darkmode</span><input type="checkbox" ${isDark()?'checked':''} onchange="sv('dark',this.checked)"></div>`,
Privatsphäre:()=>`<div class="row"><span>In der Schülerliste sichtbar</span><div class="chips">${[['Öffentlich',true],['Privat',false]].map(([l,v])=>`<span class="chip ${(ME.visible!==false)==v?'on':''}" onclick="svp('visible',${v});render()">${l}</span>`).join('')}</div></div><div class="row"><span>Meine Bookies für andere sichtbar</span><div class="chips">${[['Öffentlich',true],['Privat',false]].map(([l,v])=>`<span class="chip ${!!(WL[ME.id]&&WL[ME.id].pub)==v?'on':''}" onclick="bkPub(${v})">${l}</span>`).join('')}</div></div><div class="row"><span>Freundschaftsanfragen erhalten</span><input type="checkbox" ${ME.accept_requests!==false?'checked':''} onchange="svp('accept_requests',this.checked)"></div><div class="row"><span>Online-Status anzeigen<br><span class="m" style="font-size:13px">Andere sehen einen orangen Punkt am Profilbild, wenn du online bist.</span></span><input type="checkbox" ${localStorage.getItem('sq_hide_online')=='1'?'':'checked'} onchange="sqOnl(this.checked)"></div>`};
theme();render();boot();document.addEventListener('touchstart',()=>{},{passive:true});
</script></body></html>
